</head><body><div class="cinema-bg" aria-hidden="true"><img fetchpriority="high" src="img/ee888b87ab8e.webp" alt=""><div class="cinema-glow"></div></div><button class="motion-control" id="cinema-motion" aria-pressed="false">Ⅱ 暂停窗景</button><main id="app"></main><dialog id="memories"><div class="dialog-head"><span>我们的回忆抽屉</span><button id="close" aria-label="关闭回忆">✕</button></div><div id="memory-list"></div></dialog><script>const EVENTS=[{"id":0,"title":"借一个别人的身份","body":"咖啡喝了一半，你们忽然玩起假装打电话的游戏。对方把手放在耳边：你今天见的那个人，怎么样？问完，先低头笑了。","kind":"date","item":"一张咖啡店收据","choices":["假装向朋友承认心动","反问对方今天的感觉","放下假电话，直接说今天很开心"],"timing":{"min":0,"max":11},"memories":["我借着那个假装打给朋友的电话，承认了心动。","我把问题轻轻递回去，想听听你今天的感觉。","我放下那个假电话，直接告诉你今天很开心。借来的身份终于可以还回去。"]},{"id":1,"title":"在最高处慢下来","body":"摩天轮轻轻晃了一下。你抓住扶手，对方把手摊在你旁边，没碰你。窗外的灯一盏盏亮起来。","kind":"date","item":"摩天轮票根","choices":["把手放过去","指给对方看远处的灯","坦白自己有点怕高"],"timing":{"min":0,"max":11},"memories":["我把手放了过去。高处的那一刻，有了可以握住的东西。","我指给你看远处的灯，把窗外的一点明亮分给你。","我坦白自己有点怕高，让你看见镇定以外的我。"]},{"id":2,"title":"你记得的比我还多","body":"搬书时一本旧笔记掉下来。里面记着你初次见面点错的饮料，连你当时给自己找的借口都写了。","kind":"memory","item":"旧笔记","choices":["念出来逗逗对方","在旁边补上自己的版本","问那时为什么想把这件事记下来"],"timing":{"min":12,"max":120},"memories":["我把那几行字念出来逗你，连当时的借口都没有略过。","我在旁边补上自己的版本，让同一天有了两份记忆。","我问你当时为什么想记下这件小事，想听见笔迹背后的那一天。"]},{"id":3,"title":"不太熟练的一首歌","body":"对方坐在床沿，弹了三次同一段和弦。你问在练什么。对方把手机扣住，说：先不要笑，我想给你听。","kind":"home","item":"一段录音","choices":["安静听到最后","跟着轻轻打拍子","问能不能从头教我一小段"],"timing":{"min":1,"max":120},"memories":["我安静听到了最后，把这首还不熟练的歌记在心里。","我跟着轻轻打拍子，让那段和弦有了伴。","我请你从头教我一小段，让不太熟练的旋律有了两个人的练习。"]},{"id":4,"title":"走到旅馆的那段路","body":"晚饭后你们没叫车。走过一段很长的坡，对方问：如果那年没有遇见，我们现在会在做什么？","kind":"journey","item":"手绘散步路线","choices":["说一个离谱的平行人生","说说相遇后改变的事","停下来看看此刻的街景"],"timing":{"min":12,"max":120},"memories":["我说起一个离谱的平行人生，暂时把平常的自己放在一旁。","我说起遇见你以后改变的小事，才发现已经有不少。","我停下来和你看看此刻的街景，把假设里的远方暂时放回今天。"]},{"id":5,"title":"来自很久以后的便条","body":"争执后，餐桌上多了一张纸：未来的我们托我问一下，今天还能一起吃晚饭吗？落款画了两张皱巴巴的脸。","kind":"repair","item":"未来的便条","choices":["画两碗面回复","写下自己还需要一点时间","先把饭摆好，再当面回应"],"timing":{"min":6,"max":120},"memories":["我画了两碗面作答，给那张便条添上一顿两个人的饭。","我写下自己还需要一点时间，把迟疑也留在纸上。","我先把饭摆好，想当面回应那张便条。未来的我们，先从今天坐下来吃饭开始。"]},{"id":6,"title":"你怎么这么幼稚","body":"街角有个会回声的洞。对方一本正经地说它会回答问题，你刚靠近，就听见另一端传来一句：晚饭想吃什么？","kind":"date","item":"一张模糊的笑脸照","choices":["认真向回声点菜","绕到另一头抓个现行","换我到另一头出一道问题"],"timing":{"min":1,"max":120},"memories":["我认真向回声点了菜，陪你把幼稚进行到底。","我绕到另一头，想把那个偷偷逗我的人抓个现行。","我换到回声的另一头，也给你出了一道问题，认真接过这个幼稚的游戏。"]},{"id":7,"title":"这张照片只给你","body":"你在旅行中睡得东倒西歪。对方把拍到的照片递给你，问：留下还是删掉？照片里还有一只替你扶住帽檐的手。","kind":"journey","item":"一张私藏照片","choices":["留下，存在自己的相册","删掉这张，再一起拍一张","先收起来，等旅行结束再决定"],"timing":{"min":1,"max":120},"memories":["我留下那张照片，收进自己的相册。它不必给别人看。","我删掉了那一张，和你重新拍了一张属于此刻的照片。","我请你先收起照片，等旅行结束再一起看。此刻还不必替回忆下结论。"]},{"id":8,"title":"先别揉眼睛","body":"站台一阵风，你的眼睛进了灰。旁边的人递来一包未拆的纸巾，问要不要帮你看看。列车还要七分钟才来。","kind":"encounter","item":"一包纸巾","choices":["接过纸巾并道谢","请对方帮忙挡一下风","自己处理，请对方提醒我列车到站"],"timing":{"min":0,"max":0.1,"start":"new"},"memories":["我接过纸巾，认真道了谢。","我请你替我挡一挡风，把这点小麻烦交给了你。","我自己处理眼里的灰，也请你提醒列车到站。那七分钟有了一点小小的照应。"]},{"id":9,"title":"肩膀上很轻的一下","body":"分别时你们正想说什么，广播突然响了。对方轻轻碰了碰你的肩，手停了一秒。你回过头，对方还站着。","kind":"distance","item":"一张车票","choices":["走回去把话说完","挥手后发一条消息","停在原地，等对方把话说完"],"timing":{"min":0,"max":11},"memories":["我又走回去，把没有说完的话说完。","挥过手以后，我还是发去了一条消息。","我停在原地等你把话说完，没有让广播替我们结束告别。"]},{"id":10,"title":"只有两个读者的故事","body":"你在备忘录写下一个故事开头。晚些时候，对方接了一段，还把你最讨厌的蔬菜写成了反派。","kind":"dream","item":"共同写的故事","choices":["继续写下一段","给反派画一个头像","给故事里的两个人写一段对话"],"timing":{"min":1,"max":120},"memories":["我接着写下一段，让这个只有两个读者的故事继续。","我给反派画了头像，也在故事里留下自己的笔迹。","我给故事里的人写了一段对话，把想象也变成能来回回应的东西。"]},{"id":11,"title":"给未来埋一封信","body":"整理杂物时空出一个饼干盒。对方问，要不要各写一件现在还不敢说的心愿，过几年再打开？","kind":"home","item":"饼干盒时间胶囊","choices":["写下共同生活的愿望","写下一个自己的小梦想","写下此刻最想感谢对方的事"],"timing":{"min":6,"max":120},"memories":["我写下共同生活的愿望，把它交给还没到来的日子。","我写下自己的一个小梦想，留给未来的我们读。","我写下此刻最想感谢你的事，把今天的心意留给几年后的我们。"]},{"id":12,"title":"原来你会唱这首","body":"陌生城市的卡拉OK里，你以为对方会选一首很安静的歌。前奏响起，对方忽然站上小台阶，认真唱得跑了调。","kind":"journey","item":"点歌单","choices":["跟着一起跑调","笑着录下这段声音","点一首两个人都不熟的歌"],"timing":{"min":1,"max":120},"memories":["我也跟着唱，连跑调都没有避开。","我笑着录下那段声音，给以后留一点可以重听的快乐。","我点了一首两个人都不熟的歌，想和你一起从第一句慢慢找。"]},{"id":13,"title":"还有一句没说完","body":"出租车刚停稳，你发现对方隔着人群朝你走回来。对方站定，先喘了一口气：刚才走得太急了。","kind":"distance","item":"一次补上的告别","choices":["给对方一个拥抱","问刚才想说什么","说出自己刚才没来得及说的话"],"timing":{"min":0,"max":11},"memories":["我给了你一个拥抱，让那句没说完的话暂时停在这里。","我问起你刚才想说什么，不想漏掉那半句话。","我说出刚才没来得及说的话，让这次折返有了我的那一半。"]},{"id":14,"title":"第一次合上拍子","body":"路边琴行允许试琴。你按了几个音，对方跟着敲起桌沿。一开始总错开，第三次却突然合上了。你们同时看向彼此。","kind":"date","item":"一小段旋律","choices":["再一起试一次","把刚才的节奏录下来","交换角色，让对方弹我来打拍子"],"timing":{"min":0,"max":11},"memories":["我和你又试了一次，慢慢找同一个拍子。","我录下刚才的节奏，留住这一次合拍。","我和你交换了位置，试着从你的那一边找到同一个拍子。"]},{"id":15,"title":"空出来的那一角","body":"你随口说过想重新画画。一天回家，窗边多了腾空的小桌，旁边放着你很久没用的笔。对方问：这个光线可以吗？","kind":"dream","item":"窗边小桌","choices":["坐下画今天的窗景","请对方也搬把椅子来","先把想画的东西摆到桌上"],"timing":{"min":6,"max":120,"needs":"home"},"memories":["我坐下来画今天的窗景，让空着的那一角有了用途。","我请你也搬把椅子过来，窗边便不只是我的位置。","我先把想画的东西摆到桌上，让那个为我腾出的角落开始有自己的日常。"]},{"id":16,"title":"你的夜晚我的早晨","body":"你端着早餐，对方那边已经关了大灯。视频里只有一盏床头灯亮着。你说今天没什么特别的，对方说那就听你吃完。","kind":"distance","item":"一张视频截图","choices":["讲一件今天的小事","陪对方安静待一会儿","给对方看看窗外的早晨"],"timing":{"min":1,"max":120,"needs":"distance"},"memories":["我讲了一件今天的小事，把自己这边的日子递给你。","我陪你安静待了一会儿，没有急着填满沉默。","我把窗外的早晨给你看，让你那边的夜里也有一点我这里的光。"]},{"id":17,"title":"回家以后可以哭","body":"你见了一位很久不见的旧友，回家时心里很乱。对方没有追问，只把沙发上的毯子掀开，给你留出一半。","kind":"repair","item":"沙发上的毯子","choices":["靠过去慢慢讲","说想先安静一会儿","请对方陪我下楼走一小段"],"timing":{"min":6,"max":120,"needs":"home"},"memories":["我靠过去，慢慢讲起心里的事。","我说想先安静一会儿，把说不出口的部分留到以后。","我请你陪我下楼走一小段，想在说话之前先把呼吸慢下来。"]},{"id":18,"title":"临时搭档","body":"小店把你们误认成报名参加游戏的搭档。你刚要解释，对方已经举起号码牌，又转头等你的意思。","kind":"encounter","item":"临时号码牌","choices":["一起试试这个小游戏","笑着说明情况再聊几句","先问清游戏规则再决定"],"timing":{"min":0,"max":0.1,"start":"new"},"memories":["我和你试了试那个小游戏，先做了一回临时搭档。","我笑着说明情况，又和你多聊了几句。","我先问清游戏的规则，再决定怎样和你搭档，没有急着答应，也没有急着走开。"]},{"id":19,"title":"打给以前的自己","body":"你们经过一座废弃电话亭。对方拿起听筒，假装给年轻的自己打电话：不用着急，你后来会遇到一个很有意思的人。","kind":"memory","item":"电话亭合影","choices":["接过听筒继续说","问对方以前最担心什么","给未来的自己也留一句话"],"timing":{"min":36,"max":120},"memories":["我接过听筒，把想说给从前自己的话接了下去。","我问起你从前最担心什么，想认识那时的你。","我也给未来的自己留了一句话，让这座电话亭同时接通从前和以后。"]},{"id":20,"title":"新年的零点差一点","body":"朋友们倒数时，你们碰巧站在一起。零点的欢呼盖过了对方一句话。你只看见对方说完后有点不好意思。","kind":"date","item":"一张新年合照","choices":["请对方再说一遍","先祝对方新年快乐","问刚才那句话能不能留给我单独听"],"timing":{"min":0,"max":11},"memories":["我请你再说一遍，不想让那句话被零点的热闹盖过去。","我先祝你新年快乐，把第一句祝福交给你。","我问你那句话能不能单独再讲给我听，不想让它只属于倒数的人群。"]},{"id":21,"title":"喜欢是说得出细节","body":"对方说喜欢你把热杯子捧在两只手里，也喜欢你看见小狗就走慢。你有点意外，这些事你自己都没注意过。","kind":"date","item":"一封具体的告白","choices":["告诉对方你注意到的习惯","问还有什么被悄悄记住了","也说一个自己不太容易被注意的习惯"],"timing":{"min":0,"max":11},"memories":["我说起自己留意到的习惯，喜欢终于有了具体的样子。","我问你还有什么悄悄记住的事，想听完那些小细节。","我说起另一个不太容易被看见的习惯，主动把认识我的路再打开一点。"]},{"id":22,"title":"深夜长一点的消息","body":"聊天框里第一次出现很长一段话。对方说起家里一位重要的人，末尾又补了一句：太晚了，你明天回也可以。","kind":"encounter","item":"一段夜间消息","choices":["现在认真回复","先说收到，明早好好聊","问现在是否方便打个短电话"],"timing":{"min":0,"max":0.1,"start":"new"},"memories":["我在那个深夜认真回了消息，没有把回应留到明天。","我先告诉你收到了，约好明早再好好聊。","我问你现在是否方便打个短电话，想听听那些文字说出来时的声音。"]},{"id":23,"title":"先听见熟悉的名字","body":"约见的公园里，你还在找人，先听见有人叫聊天里那只小狗的昵称。你顺着声音看过去，对方也正在找你。","kind":"encounter","item":"初见公园的小叶子","choices":["主动挥挥手","先向小狗打个招呼","先发消息告诉对方自己的位置"],"timing":{"min":0,"max":0.1,"start":"new"},"memories":["我主动挥了挥手，让你看见我。","我先和小狗打了招呼，再走进这次相遇。","我先把位置发给你，让两个人的寻找少绕一点路。"]},{"id":24,"title":"记住一个声音","body":"社区分享会上，有人讲起第一次独自搬家的经历。没有漂亮结尾，只有凌晨装反的柜门。你听着笑了，对方正好看见。","kind":"encounter","item":"分享会小票","choices":["散场后聊聊自己的搬家","请教柜门后来怎么装好的","分享自己第一次独立做成的小事"],"timing":{"min":0,"max":0.1,"start":"new"},"memories":["散场以后，我聊起自己的搬家，接住了刚才的话题。","我问起那扇柜门后来怎样装好，想把这个小故事听完。","我说起第一次独立做成的小事，让那段搬家的故事接到自己的生活里。"]},{"id":25,"title":"为一个背包折回来","body":"观景台快关门了。你返回取遗落的包，发现刚才聊过天的人替你守着。对方说：还好，你回来了。","kind":"encounter","item":"观景台门票","choices":["邀请一起下楼","认真道谢并交换联系方式","问对方有没有落下东西，一起再检查一次"],"timing":{"min":0,"max":0.1,"start":"new"},"memories":["我邀请你一起下楼，把相处的时间再延长一点。","我认真道谢，和你交换了联系方式。","我也问你有没有落下东西，陪你再检查一次，不想只有自己被照顾。"]},{"id":26,"title":"聚会之后的小花园","body":"和对方的朋友吃过饭，你们绕进一处安静花园。对方问刚才有没有不自在，还学了一遍朋友夸张的笑声。","kind":"date","item":"花园门口的照片","choices":["说说刚才最喜欢的瞬间","坦白一个有点拘谨的地方","请对方说说自己刚才的感受"],"timing":{"min":0,"max":11},"memories":["我说起刚才最喜欢的瞬间，让聚会的余温多停了一会儿。","我坦白了自己有些拘谨的地方，没有装作游刃有余。","我请你也说说刚才的感受，让聚会后的交谈不只是关于我。"]},{"id":27,"title":"随手画的东西长大了","body":"纪念日蛋糕上有一只歪歪扭扭的小鸟。旁边放着对方练习时的草稿，最初画错的那条腿也被留在了蛋糕上。","kind":"memory","item":"小鸟蛋糕装饰","choices":["找出当年的原画","给这只鸟补上下一段故事","给今年的小鸟添一个新细节"],"timing":{"min":12,"max":120},"memories":["我找出当年的原画，重新看那个最初的念头。","我替那只鸟补上下一段故事，让它继续往前飞。","我替今年的小鸟添了一个新细节，让纪念日也留着现在的笔迹。"]},{"id":28,"title":"一座装在玻璃里的小城","body":"对方送来一个小小的雪景球。你摇了一下，里面的雪慢慢落下。对方说它很像你提过的那个冬天。","kind":"date","item":"雪景球","choices":["讲讲那个冬天","约定真的去看一次雪","把雪景球放到一起能看见的地方"],"timing":{"min":1,"max":120},"memories":["我讲起那个冬天，把玻璃里的小城接回自己的记忆。","我和你约定，真的去看一次雪。","我把雪景球放到我们都能看见的地方，让那个冬天在日常里停一停。"]},{"id":29,"title":"每天经过的窗口","body":"在你每天工作的窗口，对方递进来的不是取件单，而是一张手写邀请：下班以后，愿意和我商量一个家吗？","kind":"home","item":"窗口里的邀请","choices":["下班一起认真谈谈","约个不匆忙的周末再谈","先写下对家的期待，再约时间交换"],"timing":{"min":6,"max":120},"memories":["我约你下班后认真谈谈，让话有一段完整的时间。","我约了一个不匆忙的周末，把重要的话留给从容的时候。","我先写下自己对家的期待，约你找个完整的时间交换，不让重要的愿望匆忙经过窗口。"]},{"id":30,"title":"到了你熟悉的地方","body":"你们路过对方长大的街区。平时话不多的人，忽然能讲出每一家小店的旧名字，还知道哪一段路会开花。","kind":"journey","item":"故乡街道地图","choices":["请对方带路走慢一点","选一家老店坐下来听","问哪里是对方最想再去一次的地方"],"timing":{"min":1,"max":120},"memories":["我请你带路，也请你走慢一点，让我看看你熟悉的地方。","我选了家老店坐下来，准备慢慢听你讲。","我问你最想再去哪个地方，想让这次同行也回应你的惦记。"]},{"id":31,"title":"出发前说清楚","body":"行李都收好了，你们却还没决定接下来住在哪座城。对方坐到箱子旁边，说：这次别各自猜了。","kind":"repair","item":"共同生活计划","choices":["把自己的顾虑说出来","先听对方想怎么生活","先定一个试住期限，不急着永久决定"],"timing":{"min":6,"max":120},"memories":["我说出自己的顾虑，把行李以外的事情也摊开来。","我先听你想怎样生活，没有急着替两个人作答。","我提议先定一段试住时间，让两个人有机会亲自看看再决定。"]},{"id":32,"title":"一双手套两个口袋","body":"小摊只剩最后一副你们都喜欢的手套。对方开玩笑说一人一只算了。最后真的各揣一只，边走边笑。","kind":"encounter","item":"半副手套","choices":["约下次交换着戴","请对方喝杯热饮暖手","各买别的款式，把喜欢的这一副留在记忆里"],"timing":{"min":0,"max":0.1,"start":"new"},"memories":["我约好下次交换着戴，让一双手套有了轮流的用法。","我请你喝杯热饮，想让空着的那只手也暖起来。","我提议各自选别的款式，那副都喜欢的手套可以先留在今天的笑里。"]},{"id":33,"title":"另一只回来了","body":"你把旧手套放在桌上晾干，旁边不知何时多了另一只。对方从厨房探头：凑齐了，冬天可以出门了。","kind":"memory","item":"重新凑齐的手套","choices":["提议去散步","把两只并排拍下来","把这一对手套收在同一个地方"],"timing":{"min":12,"max":120,"prior":32,"gap":6},"memories":["我提议去散步，让这一天再多一段并肩的路。","我把两只并排拍下来，留下重新凑成一对的样子。","我把两只手套收在一起，让下次出门不必再找另一只。"]},{"id":34,"title":"先看见你怎么待别人","body":"餐厅里一个小孩打翻了水。邻桌的人先扶住杯子，又把自己的纸巾递过去。后来你们在门口一起等雨停。","kind":"encounter","item":"餐厅便签","choices":["聊聊这场突然的雨","问对方常来这家店吗","把自己多带的纸巾也递过去"],"timing":{"min":0,"max":0.1,"start":"new"},"memories":["我聊起这场突然的雨，给初次的交谈找了一个开头。","我问你是不是常来这家店，想从这里认识你。","我把多带的纸巾也递过去，让这场突然的雨里多一点能做的小事。"]},{"id":35,"title":"去你想去的地方","body":"对方一直想去海边写生，终于安排了一个短假。你收到一张画到一半的海，又收到一句：旁边还有个空位置。","kind":"journey","item":"半张海景画","choices":["去陪对方几天","送去一段声音陪着画","问能不能为那幅画留一个共同的题目"],"timing":{"min":6,"max":120},"memories":["我去陪你住了几天，让远方暂时近一点。","我送去一段声音，陪着你画画。","我问能不能一起给那幅画起个名字，先用一个题目坐到你身旁。"]},{"id":36,"title":"陌生城市的一条岔路","body":"地图建议走大路，巷子里却飘出面包香。对方停在路口看你：要不要暂时不按计划？","kind":"journey","item":"面包纸袋","choices":["一起拐进小巷","先买面包再按原路走","记下小巷的位置，约另一天专程来"],"timing":{"min":1,"max":120},"memories":["我和你拐进小巷，让陌生的城市多出一条我们的路。","我先买了面包，再和你沿原路走。","我记下小巷的位置，约你另一天专程来，不让面包香只成为路上的一次错过。"]},{"id":37,"title":"理想清单之外","body":"你整理旧手机，翻出以前写的理想伴侣清单。眼前的人和上面不太一样，却正记得替你把水放凉。","kind":"memory","item":"旧手机里的清单","choices":["把这件事讲给对方听","重新写下现在重视的事","把旧清单收好，暂时不改写它"],"timing":{"min":6,"max":120},"memories":["我把这件事讲给你听，让你知道我如今在意什么。","我重新写下现在重视的事，把旧清单留在了过去。","我收好那份旧清单，让从前的想象和眼前的你各有自己的位置。"]},{"id":38,"title":"给你留了一个枕头","body":"客厅被搭成一个小帐篷，顶上贴着纸星星。对方从里面探出头，把多出来的枕头往旁边拍了拍。","kind":"home","item":"纸星星","choices":["钻进去一起躺着","去拿两杯热饮回来","给帐篷添一盏小灯"],"timing":{"min":6,"max":120,"needs":"home"},"memories":["我钻进去和你一起躺着，收下那个为我留出的枕头。","我去拿了两杯热饮回来，给这片小天地添一点暖。","我给小帐篷添了一盏灯，让客厅里这个临时的家亮起来。"]},{"id":39,"title":"在货架之间猜音乐","body":"旧唱片店里，对方拿起一张封套哼起前奏。你没猜中，对方换了一种更夸张的唱法，自己先笑得接不上气。","kind":"date","item":"唱片店收据","choices":["接着猜下一首","选一首让对方猜","请对方讲讲为什么喜欢这张唱片"],"timing":{"min":0,"max":120},"memories":["我接着猜下一首，舍不得让这个小游戏结束。","我选了一首让你猜，把出题的机会接过来。","我请你讲讲为什么喜欢这张唱片，想在前奏之外听到你的故事。"]},{"id":40,"title":"绕一点路才还给你","body":"你们约好用三张小纸条安排一次寻宝。最后的目的地是你常去的面馆，对方正替你占着靠窗的位置。","kind":"date","item":"三张寻宝纸条","choices":["照着线索慢慢找","一路发语音汇报进度","在找到的纸条背面留一句回应"],"timing":{"min":1,"max":120},"memories":["我照着线索慢慢找，让绕远的路也有了意思。","我一路发语音，把寻找的进度都讲给你听。","我在找到的纸条背面留下回应，让寻找的路也带着我的字迹。"]},{"id":41,"title":"这次不躲在文字后面","body":"你写了一条邀请，删掉又重写。对方刚好经过，你把手机收起来。机会只是一句很普通的：周末有空吗？","kind":"encounter","item":"第一次邀请","choices":["当面把邀请说出来","整理好以后发出去","坦白自己刚才一直在犹豫怎么开口"],"timing":{"min":0,"max":0.1,"start":"new"},"memories":["我当面说出了邀请，没有再躲到文字后面。","我整理好想说的话，终于把消息发了出去。","我坦白自己刚才一直在想怎样开口，把那点笨拙也交给了你。"]},{"id":42,"title":"不太熟悉的舞步","body":"小广场有人跳舞。对方问要不要试一下，你说不会。对方把脚往旁边挪：正好，我也只会这一步。","kind":"date","item":"广场上的短视频","choices":["跟着试一步","先坐旁边一起看","请对方先示范，我帮忙数拍子"],"timing":{"min":0,"max":120},"memories":["我跟着试了一步，把生疏也带进了音乐里。","我和你先坐在旁边看。不必立刻学会，先并肩待着也很好。","我请你先示范，自己在旁边数拍子，用另一种方式走进这支舞。"]},{"id":43,"title":"第二次说起同一件事","body":"上次谈未来时，你们不欢而散。今天对方带来一张重新画过的计划表，里面多了你说过的重要事情。","kind":"repair","item":"改过的计划表","choices":["一起继续修改","先肯定被认真听见的部分","先选一件能落实的小事试着改变"],"timing":{"min":6,"max":120},"memories":["我和你继续修改，让第二次谈起这件事有了新的进展。","我先说起那些被认真听见的部分，让你知道我有留意。","我先和你选一件能做到的小事，想让重新画过的计划从行动里开始。"]},{"id":44,"title":"原来你没有离开","body":"你误以为对方已经接受异地工作，几天都不敢问。晚饭时对方拿出两份方案：还没定，我想听听你的。","kind":"repair","item":"两份工作方案","choices":["坦白这几天的误会","逐项讨论两个方案","先确认什么时候必须作决定"],"timing":{"min":6,"max":120},"memories":["我坦白这几天的误会，不再让猜测替自己说话。","我和你逐项讨论两个方案，把分歧一件件摊开。","我先问清决定的期限，想给讨论留足时间，也不让误会继续拖着。"]},{"id":45,"title":"替你接来想见的人","body":"你身体不舒服，又有点想家。对方问清你的意思，去接了一位你想见的亲人，回来时还带着熟悉味道的粥。","kind":"home","item":"一只保温饭盒","choices":["一起吃一点热粥","让对方也坐下休息","问对方今天有没有好好吃饭"],"timing":{"min":6,"max":120},"memories":["我和你一起吃了点热粥，先照顾眼前这顿饭。","我让你也坐下来歇歇，不想只被你照顾。","我问你今天有没有好好吃饭，在被照顾的时候也想看见你的需要。"]},{"id":46,"title":"半夜一起收拾水渍","body":"洗衣机排水管松了。你们半夜赤脚站在毛巾上，一个拧管子，一个递盆。处理完，谁也忍不住笑了。","kind":"home","item":"两双湿拖鞋","choices":["分工把地擦干","先递条干毛巾给对方","先暂停洗衣，商量明天怎么处理"],"timing":{"min":6,"max":120,"needs":"home"},"memories":["我和你分工擦干地上的水，收拾这个意外的夜晚。","我先递给你一条干毛巾，把地上的事放慢了一步。","我先停下洗衣，和你商量明天再处理剩下的事，不想把疲惫硬撑成能干。"]},{"id":47,"title":"回来是我的选择","body":"独自在另一座城生活一阵后，你再次来到熟悉的门口。这一次你有了自己的工作和计划，对方开门时没有催你做决定。","kind":"distance","item":"一把旧钥匙","choices":["说说这段时间的变化","邀请对方出去走走","约定先见几次，再讨论以后怎么相处"],"timing":{"min":6,"max":120,"needs":"distance"},"memories":["我说起这段时间的变化，重新把自己介绍给你。","我邀请你出去走走，给这次重逢留一段路。","我约你先慢慢见几次，不让一次回来就替以后作完所有决定。"]},{"id":48,"title":"写在你手边的话","body":"朋友聚会很热闹。你谈起一件在意的事，对方没插嘴，只把餐巾纸推过来，上面写着：我听见了，回去我们慢慢聊。","kind":"date","item":"一张餐巾纸","choices":["在纸上写下回应","轻轻碰一下对方的手","把纸条收好，约好散场后再聊"],"timing":{"min":0,"max":11},"memories":["我在纸上写下回应，让你的话旁边有了我的笔迹。","我轻轻碰了碰你的手，把回应留在那个小动作里。","我收好那张纸条，约你散场后继续聊，让被听见的那句话有一个下文。"]},{"id":49,"title":"终于看见你工作的地方","body":"第一次去对方的工作室，你认出视频里常出现的那扇窗。对方把第二把椅子拖过来，说这个位置下午有阳光。","kind":"home","item":"工作室窗景","choices":["坐下陪一会儿","请对方介绍正在做的东西","问下次能不能带自己的东西来一起忙"],"timing":{"min":1,"max":120},"memories":["我坐下来陪了一会儿，看你在熟悉的地方忙碌。","我请你介绍正在做的东西，想听懂你的日常。","我问下次能不能带自己的事来做，想和你试试各自忙碌也坐在一起的日子。"]},{"id":50,"title":"把窗边留给你","body":"入住小旅馆时，你多看了两眼窗外。对方注意到了，和你商量把两把椅子挪过去，早餐就在那里吃。","kind":"journey","item":"窗边早餐照片","choices":["一起搬椅子","先去买明早的面包","先拍下窗外，留作这次入住的第一张照片"],"timing":{"min":1,"max":120},"memories":["我和你一起搬椅子，把窗边的位置安顿下来。","我先去买明早的面包，让明天从一顿早餐开始。","我先拍下窗外，让这段旅程从我们都多看了一眼的风景开始。"]},{"id":51,"title":"又是这扇窗","body":"许多年后，你们住回那家小旅馆。窗框换了颜色，远处的山还在。对方站到旧照片里的位置，等你按快门。","kind":"memory","item":"两张相隔多年的照片","choices":["照着旧姿势再拍一次","拍下现在自然的样子","拍下窗框和山，留下这些年的变化"],"timing":{"min":60,"max":120,"prior":50,"gap":48},"memories":["我照着旧姿势又拍了一次，留给两张照片慢慢对照。","我拍下此刻自然的样子，让今天拥有自己的模样。","我把窗框和山一起拍下，想记住变化的部分，也记住还在的部分。"]},{"id":52,"title":"空房子里的想象","body":"看房结束，你们站在还没有家具的客厅。对方用脚尖比画：这里够不够你放一张写字桌？","kind":"home","item":"第一张房间草图","choices":["也替对方留一个角落","先讨论各自最需要的空间","量一下空间，再各画一份布置"],"timing":{"min":6,"max":120},"memories":["我也替你留了一个角落，让空房子装得下两个人。","我先和你讨论各自最需要的空间，把彼此都放进打算里。","我先量了量空房间，约你各画一份布置，让两种生活都能被看见。"]},{"id":53,"title":"回到自己选的生活","body":"你从老家回到共同生活的城市。对方在出口接过一件行李，没有问什么时候彻底定下来，只问今天想先回家还是吃饭。","kind":"distance","item":"到站的小票","choices":["先回家休息","找个安静地方一起吃饭","先讲讲这次回家的感受"],"timing":{"min":6,"max":120,"needs":"home"},"memories":["我先回家休息，把自己安放回熟悉的生活。","我找了个安静的地方和你吃饭，慢慢回到日常。","我先讲起这次回家的感受，让行李之外的东西也有地方放下。"]},{"id":54,"title":"突然下雨的阳台","body":"雨毫无预兆地下大了。你们同时冲向阳台，一人抱回床单，一人抢救花盆，最后站在门口检查彼此湿了多少。","kind":"home","item":"被救回的小花盆","choices":["先帮对方擦干头发","把抢救清单念成笑话","先换下湿衣服，剩下的待会一起收拾"],"timing":{"min":6,"max":120,"needs":"home"},"memories":["我先帮你擦干头发，再顾阳台上的忙乱。","我把抢救清单念成了笑话，让这场雨多了一点好笑的记忆。","我先换下湿衣服，约你待会儿一起收拾，照顾好人再照顾阳台。"]},{"id":55,"title":"谢谢你一直认真听","body":"对方要去外地参加一个重要机会。你送到车站才想起，有句话一直没说：以前那些很不成熟的想法，你都认真听过。","kind":"distance","item":"一封出发前的信","choices":["现在当面说出来","写下来让对方路上看","问对方临行前最需要哪一种支持"],"timing":{"min":6,"max":120,"needs":"distance"},"memories":["我当面说出感谢，不再留着等更合适的时候。","我把感谢写下来，让你能在路上慢慢看。","我问你临行前最需要什么，想让感谢也变成此刻能做的一件事。"]},{"id":56,"title":"教我怎样看懂它","body":"对方喜欢的诗集你总读不进去。今天你翻到一页，问为什么喜欢这一首。对方先问你读到了什么，没有急着讲答案。","kind":"dream","item":"折角的诗页","choices":["说说自己的真实感受","请对方读给你听","把读不懂的那一行指给对方看"],"timing":{"min":0,"max":120},"memories":["我说出自己的真实感受，没有假装都能看懂。","我请你读给我听，想借你的声音靠近它。","我把读不懂的那一行指给你看，不假装明白，也不急着放弃。"]},{"id":57,"title":"信里只有很小的事","body":"这次出差没有特别的见闻。对方发来的消息却写了路边树开花、便利店换了招牌，还有家里植物新长的一片叶子。","kind":"distance","item":"一封日常来信","choices":["回报自己这边的小事","约定今晚一起看月亮","把这封日常消息存成一页记录"],"timing":{"min":6,"max":120,"needs":"distance"},"memories":["我也讲起自己这边的小事，让信里的日常有了来回。","我和你约好今晚看月亮，让两边的夜晚有一点相同。","我把这封没有大事的消息存下来，让远方普通的一天也有一页位置。"]},{"id":58,"title":"只有我们知道的缩写","body":"你们给旧旅行箱贴了一张手写贴纸，上面是一个外人看不懂的缩写。路上每次认行李，你都会先看到它。","kind":"journey","item":"缩写行李贴","choices":["为缩写编个好笑的解释","把真正含义记进日记","给贴纸拍照，记下第一次带它出发的日子"],"timing":{"min":12,"max":120},"memories":["我替那个缩写编了个好笑的解释，留作我们自己的玩笑。","我把真正的含义记进日记，不让时间把它弄丢。","我拍下那张贴纸，记住它第一次陪我们出发的日子。"]},{"id":59,"title":"先坐下来再说","body":"久别后，你们在花园碰面。准备好的话忽然都忘了。对方擦掉椅子上的落叶，拍拍旁边的位置。","kind":"distance","item":"花园长椅照片","choices":["坐下慢慢聊","先一起看看周围的变化","先说自己现在最想说的一句话"],"timing":{"min":6,"max":120,"needs":"distance"},"memories":["我坐下来慢慢聊，给重逢留一点耐心。","我先和你看看周围的变化，再慢慢说到我们。","我先说出此刻最想说的一句话，不再从忘掉的准备里寻找开头。"]},{"id":60,"title":"风从两个人之间经过","body":"海边观景台的风很大。你站在栏杆内，对方伸手替你按住快飞走的帽子，另一只手等着你来牵。","kind":"journey","item":"被风吹乱的合影","choices":["牵住那只手","站近一点一起看海","把帽子收好，和对方听一会儿海风"],"timing":{"min":0,"max":120},"memories":["我牵住了那只手，让风从别的地方经过。","我站近了一点，和你一起看海。","我把帽子收好，和你听了一会儿风，把靠近留在安静里。"]},{"id":61,"title":"去你熟悉的小聚会","body":"你跟对方来到一间有现场音乐的小馆。这里没有正式舞池，几个人挪开凳子就跳起来。对方抬抬眉，等你一起。","kind":"date","item":"小馆的桌号牌","choices":["一起加入他们","在桌边轻轻跟着节奏","请对方介绍这里常听的音乐"],"timing":{"min":0,"max":120},"memories":["我和你一起加入他们，试着走进你熟悉的热闹。","我在桌边轻轻跟着节奏，用自己的方式待在这里。","我请你介绍这里常听的音乐，想先从声音认识你的这处日常。"]},{"id":62,"title":"终于修好那扇窗","body":"早年你说想要一个能晒太阳的角落。后来生活忙乱，计划一直没做。这个周末，对方找出工具，问要不要从修窗开始。","kind":"home","item":"窗台的一小块木头","choices":["一起动手","先画个简单的布置图","先确认工具和时间，再一起开工"],"timing":{"min":36,"max":120,"needs":"home"},"memories":["我和你一起动手，把那扇窗的事做完。","我先画了张简单的布置图，给接下来的日子留个轮廓。","我先和你确认工具与时间，让搁了很久的愿望有一个能开始的下午。"]},{"id":63,"title":"把这一生读给你听","body":"相伴的日子渐长，你们把保存的票根、照片和便条铺满桌子。对方挑出第一张，读到一半，笑得把眼镜摘下来。","kind":"memory","item":"一起整理的回忆册","choices":["接着讲后来的事","录下对方讲故事的声音","替票根和便条按时间排一排"],"timing":{"min":36,"max":120},"memories":["我接着讲后来的事，让我们的故事再往前一点。","我录下你讲故事的声音，想把讲述本身也留下。","我把票根和便条按时间排好，让铺满桌子的日子重新连起来。"]},{"id":64,"title":"同时站在两个地方","body":"旅行地图上有一条城市分界线。你随口说想同时站在两边。对方记住了，第二天特意带你走到那块不起眼的路牌前。","kind":"journey","item":"分界线合影","choices":["一人站一边拍张照","一起跨过去再跨回来","记下路牌上的名字，写一句旅行备注"],"timing":{"min":1,"max":120},"memories":["我和你一人站一边拍照，留住这个特别的位置。","我和你一起跨过去，又跨回来，认真玩了一回这个小把戏。","我记下路牌的名字，给这段不起眼的路留一句属于我们的备注。"]},{"id":65,"title":"为一颗星提前准备","body":"你提过想看流星。对方查好天气，借来两把折叠椅，又装了一壶热水。出门前还问：等不到也可以，就当看夜空。","kind":"journey","item":"夜空观察便签","choices":["一起出门试试","准备一份夜间小点心","也准备一份对方会喜欢的小东西"],"timing":{"min":1,"max":120},"memories":["我和你一起出门试试，让准备有了开始。","我准备了一份夜间小点心，把等待也照顾进去。","我也准备了一份你会喜欢的小东西，让等待星星的夜里有来有回。"]},{"id":66,"title":"今天没有大事也想告诉你","body":"异地后的一个普通晚上，聊天内容快用完了。对方发来一张晚饭照片：卖相一般，但这个我也想让你知道。","kind":"distance","item":"第一周的晚饭照片","choices":["发回自己的晚饭","打电话一起吃完","问对方这顿饭最想分享哪一口"],"timing":{"min":6,"max":120,"needs":"distance"},"memories":["我把自己的晚饭发给你，让普通的一餐有了分享的人。","我打了电话，和你一起吃完这顿饭。","我问你这顿饭最想分给我哪一口，让远处的晚饭有了可以一起想象的味道。"]},{"id":67,"title":"自行车停在咖啡店外","body":"很久不见，你把自行车锁好，抬头发现对方坐在窗边。那人看见你，先把对面的杯垫摆正。","kind":"distance","item":"一张咖啡杯垫","choices":["进去坐下聊聊","隔着玻璃先挥手","先问一句，这些日子过得好吗"],"timing":{"min":6,"max":120,"needs":"distance"},"memories":["我走进去坐下，和你慢慢聊。","我隔着玻璃先挥了挥手，让见面从窗外开始。","我先问你这些日子过得好吗，让重逢从今天的你开始。"]},{"id":68,"title":"总响的柜门不响了","body":"你每次开柜门都要扶一下。某天回家，它忽然稳稳停住。对方手上还留着一点木屑，说刚好找到了合适的螺丝。","kind":"home","item":"一颗备用螺丝","choices":["认真说一声谢谢","接过工具收拾桌面","请对方教我下次怎么处理"],"timing":{"min":6,"max":120,"needs":"home"},"memories":["我认真说了一声谢谢，为那件终于安静下来的小事。","我接过工具收拾桌面，把剩下的活接过来。","我请你教我下次怎样处理，不想让照顾总是只有一个人会做。"]},{"id":69,"title":"你的杯子有了固定位置","body":"朋友来家里做客，问多出来的杯子是谁的。对方很自然地说：这是你的，别放错格子。你才发现它已经有自己的位置。","kind":"home","item":"专属杯子位置","choices":["给杯底画个小记号","也替对方整理一个格子","和对方商量其他常用物品放在哪里"],"timing":{"min":6,"max":120,"needs":"home"},"memories":["我在杯底画了个小记号，认领这个小小的位置。","我也替你整理出一个格子，让你的东西有地方可放。","我和你商量其他东西的位置，让多出来的杯子慢慢接到真实的日常。"]},{"id":70,"title":"选一件别人看不懂的东西","body":"旧物市集上你们都停在一幅不出名的小画前。画里只是两把椅子。对方说有点像你们昨晚坐过的地方。","kind":"date","item":"旧市集的小画","choices":["买回去挂在家里","拍下来以后自己画一幅","先问问小画的来历"],"timing":{"min":1,"max":120},"memories":["我把它买回去挂在家里，留下只有我们懂得的喜欢。","我先拍下来，留着以后自己画一幅。","我先问起那幅小画的来历，想知道两把椅子在遇见我们之前的故事。"]},{"id":71,"title":"一年后还在同一棵树下","body":"你们按约回到那次沿河散步经过的树旁。树长高了些，周围换了一家店。对方拿出一张新写的纸条，先不让你看。","kind":"memory","item":"树下的周年便条","choices":["先猜猜写了什么","交换今年的新纸条","先说出今年最想一起做的一件事"],"timing":{"min":12,"max":120,"prior":150,"gap":12},"memories":["我先猜了猜你写了什么，舍不得立刻揭开答案。","我和你交换了今年的新纸条，让这棵树又多记住一年。","我先说出今年最想和你做的一件事，让树下的见面有新的愿望。"]},{"id":72,"title":"一盆植物替我陪你","body":"你不在家的那段时间，对方照顾了你养得不太好的植物。回来时它冒出新芽，花盆底下压着一张浇水记录。","kind":"home","item":"浇水记录","choices":["一起给新芽拍照","接过下一周的照料","把照料记录接着写下去"],"timing":{"min":6,"max":120},"memories":["我和你给新芽拍了照，记下它长出来的样子。","我接过下一周的照料，把等待长大的日子分担下来。","我接着写那份照料记录，把你不在的日子也慢慢照顾进去。"]},{"id":73,"title":"藏在搬家箱里的信","body":"收拾最后一只箱子时，你发现一封没有寄出的信。对方看见后有点不好意思，说那时候总怕说得太多。","kind":"memory","item":"没寄出的信","choices":["问能不能现在读","请对方亲口讲给你听","先把信收好，等对方愿意再读"],"timing":{"min":6,"max":120},"memories":["我问能不能现在读，想早点听见信里的话。","我请你亲口讲给我听，让纸上的话有你的声音。","我先把信收好，等你愿意再读，让没有寄出的心事仍有自己的时间。"]},{"id":74,"title":"节日里很自然地牵手","body":"小镇庆典的人群忽然挤过来。对方伸手问你要不要一起走。越过热闹的路口后，那只手还没有松开。","kind":"date","item":"庆典纸手环","choices":["继续牵着走","轻轻晃一下回应","问对方想去热闹处还是安静处"],"timing":{"min":0,"max":11},"memories":["我继续牵着你往前走，没有把手松开。","我轻轻晃了一下手，回应这次自然的靠近。","我问你想往热闹里去，还是找个安静处，让牵着手的路由两个人一起选。"]},{"id":75,"title":"给未来的我们","body":"你们各写一封给未来的信。对方写得很慢，最后说：无论以后住在哪里，希望你还留着自己的小爱好。","kind":"home","item":"写给未来的信","choices":["也写下对方的愿望","把信放进共同的盒子","给未来的信留一页空白"],"timing":{"min":6,"max":120},"memories":["我也写下你的愿望，让信里不只有自己的未来。","我把信放进共同的盒子，让它和我们的东西待在一起。","我给未来留了一页空白，愿意让后来的我们有地方写下新的愿望。"]},{"id":76,"title":"偶然读到的一段温柔","body":"书店有一块自愿留言的墙。你读到一段很笨拙却认真的想念，旁边的人问：你也觉得这句写得很好吗？","kind":"encounter","item":"书店留言卡","choices":["分享自己喜欢的那一句","写一张新的留言","问对方最先留意到的是哪一句"],"timing":{"min":0,"max":0.1,"start":"new"},"memories":["我把读到的那句喜欢的话分享给你。那些原本独自读过的字，从此多了一个读者。","我写下一张新的留言，把自己的话也留在这里。","我问你最先看见哪一句，想知道同一面墙怎样被两个人不同地读过。"]},{"id":77,"title":"我想重新开始相信","body":"夜谈时，对方说起过去一次失去。说到最后，声音放轻了：我可能会慢一点，但我想再试试。","kind":"repair","item":"一次坦诚夜谈","choices":["告诉对方不用赶","也说说自己的不安","问怎样的相处速度会让对方安心"],"timing":{"min":0,"max":11},"memories":["我告诉你不用赶，愿意给重新相信留一点时间。","我也说起自己的不安，让你知道迟疑的不只一个人。","我问怎样的速度会让你安心，把慢一点说成可以一起商量的事情。"]},{"id":78,"title":"风雨来临前的小分工","body":"旅馆窗外忽然起风。你们一起收进阳台的椅子、关好窗，再把剩下的饼干摆上桌。哪儿也去不了的晚上变长了。","kind":"journey","item":"雨夜的饼干盒","choices":["泡茶等雨停","打开灯聊聊各自的故事","先留一会儿安静，听窗外的风"],"timing":{"min":1,"max":120},"memories":["我泡了茶等雨停，暂时把外面的风雨留在窗外。","我打开灯，和你聊起各自的故事。","我先和你听了一会儿窗外的风，让变长的夜晚不必一直有话。"]},{"id":79,"title":"远方的生活也有你的位置","body":"对方去另一座城学习，信里除了想你，还写了新朋友和学会的手艺。最后附了一句：回来想做给你看。","kind":"distance","item":"远方寄来的明信片","choices":["追问那门新手艺","分享自己最近的新发现","讲一个自己也想学的新东西"],"timing":{"min":6,"max":120,"needs":"distance"},"memories":["我追问那门新手艺，想知道你在远方学会了什么。","我分享最近的新发现，让你也看看我这一边的生活。","我说起自己也想学的新东西，让远方的变化带着两个人一起生长。"]},{"id":80,"title":"先喜欢一个声音","body":"停电的小店里只有蜡烛。你和旁边的人聊了很久，灯忽然亮了，你们都眯了一下眼，然后笑着重新打招呼。","kind":"encounter","item":"停电夜的收据","choices":["正式介绍一下自己","约下次在有灯的时候见","把刚才没讲完的话接着聊完"],"timing":{"min":0,"max":0.1,"start":"new"},"memories":["我正式介绍了自己，让声音终于有了来处。","我约好下次在有灯的时候见，把模样留给下一次。","灯亮以后，我把没讲完的话接着说完，不急着让相遇换一种样子。"]},{"id":81,"title":"不重来的星期二","body":"没有庆祝，也没有旅行。你们照常买菜、洗碗、等衣服晾干。傍晚对方问今天怎么样，你忽然觉得已经很好。","kind":"home","item":"一个普通星期二","choices":["说今天这样就很好","提议晚饭后散一小会儿步","记下今天最舒服的一个时刻"],"timing":{"min":6,"max":120,"needs":"home"},"memories":["我说今天这样就很好，不必重新来过。","我提议晚饭后散一小会儿步，给平常的日子续上一段。","我记下今天最舒服的一刻，让没有庆祝的日子也有值得留下的部分。"]},{"id":82,"title":"你比我先记住这次相遇","body":"你以为是第一次见面，对方却记得你曾在活动里帮忙扶过一摞书。原来在你还没察觉时，你已经进入过另一个人的一天。","kind":"encounter","item":"活动入场卡","choices":["问问那天的细节","说现在可以重新认识","问对方当时为什么没有打招呼"],"timing":{"min":0,"max":0.1,"start":"new"},"memories":["我问起那天的细节，想听听你比我多记住的部分。","我说可以从现在重新认识，让这次见面有新的开头。","我问你当时为什么没有打招呼，想听完自己没发现的那次相遇。"]},{"id":83,"title":"未来的我们站在这里","body":"看着年轻时的合影，你们尝试把头发弄乱，假装很老的样子。对方说：到时候还站这边，你别认错了。","kind":"memory","item":"假装变老的合影","choices":["约定多年后重拍","替未来的合影写一句说明","选一个此刻自然的姿势，也拍下来"],"timing":{"min":36,"max":120},"memories":["我和你约好多年后重拍，把同一个位置留给未来。","我替未来的合影写下一句说明，先为那一天留个位置。","我也留下一张此刻自然的样子，让未来能同时看见玩笑和今天。"]},{"id":84,"title":"把你没见过的旧照片找来","body":"你提起小时候住过的房子。对方后来在公开旧相册里找到那条街，与你确认过后，把照片打印出来放在桌上。","kind":"home","item":"一张旧街照片","choices":["指给对方看曾经的窗口","讲一个小时候的小故事","把照片上的变化讲给对方听"],"timing":{"min":6,"max":120},"memories":["我指给你看曾经的窗口，让你知道我从哪里望过世界。","我讲了一个小时候的小故事，把从前的自己带到你面前。","我把旧照片里已经改变的地方讲给你听，让你认识那条街，也认识后来的人生。"]},{"id":85,"title":"隔着城市一起走路","body":"对方发来一条私人路线：第二个路口有树，树下停两分钟。你照着走，耳机里听对方讲为什么喜欢那里。","kind":"distance","item":"私人散步路线","choices":["按路线慢慢走完","也录一条自己的路线","把沿路的声音录下来回应"],"timing":{"min":1,"max":120,"needs":"distance"},"memories":["我按那条路线慢慢走完，试着看你看过的街景。","我也录了一条自己的路线，把我熟悉的街道送给你。","我录下沿路的声音回应你，让同一条路带回一点属于我的听见。"]},{"id":86,"title":"重新认识眼前的人","body":"你们尝试像初次约会一样聊天。问到最近喜欢什么时，你发现对方的答案变了。原来熟悉的人也一直在生长。","kind":"date","item":"重新认识的问题卡","choices":["问一个从没问过的问题","分享自己新出现的爱好","请对方问我一个新的问题"],"timing":{"min":36,"max":120},"memories":["我问了一个从没问过的问题，重新认识眼前的你。","我说起自己新有的爱好，让你认识最近的我。","我请你也问我一个新问题，让重新认识是两个人的事。"]},{"id":87,"title":"知道不同仍想一起试","body":"你喜欢提早计划，对方习惯临时决定。一次争执之后，你们把两种想法写在纸上，发现并不是谁比较不在乎。","kind":"repair","item":"折中的周末计划","choices":["各留一天给不同安排","先确定最重要的共同部分","先试一次折中的安排，再一起复盘"],"timing":{"min":6,"max":120},"memories":["我和你各留一天给不同的安排，容下两种喜欢。","我先和你确定最重要的共同部分，再慢慢安放不同。","我和你先试一次折中的安排，约好回来再说感受，不急着争出一种正确。"]},{"id":88,"title":"替你整理那些没完成的作品","body":"对方发现你总说自己的作品不够好，便挑出几张认真问：这几张能不能一起装成册？我觉得它们值得留下。","kind":"dream","item":"第一本作品小册","choices":["一起挑选与整理","请对方说说喜欢的理由","先挑一张自己最舍不得的作品"],"timing":{"min":6,"max":120},"memories":["我和你一起挑选整理，让未完成的东西重新摊开。","我请你说说喜欢的理由，想看看你眼里的那些作品。","我先挑出最舍不得的一张，让整理从自己仍想保留的部分开始。"]},{"id":89,"title":"终于写下感谢","body":"你想给一段旧时光写封告别信。对方留给你一段安静时间，晚些时候只问：现在要不要出去透透气？","kind":"repair","item":"一封告别信","choices":["把想说的写完","和对方出去慢慢走","问对方愿不愿意读其中一小段"],"timing":{"min":6,"max":120},"memories":["我把想说的感谢写完，不再停在开头。","我和你出去慢慢走，让话有一段可以展开的路。","我问你愿不愿意读其中一小段，把告别旧时光的过程也分享一点给你。"]},{"id":90,"title":"允许你和我不一样","body":"你们原本想选同一种生活方式，后来发现兴趣并不重合。对方划掉日程表上的一个共同项目，说：这个你自己去也很好。","kind":"repair","item":"重新分配的周末","choices":["支持彼此保留独处时间","找一个都愿意参加的新活动","约好各自活动后再分享见闻"],"timing":{"min":6,"max":120},"memories":["我支持彼此保留独处的时间，让靠近也有余地。","我找了一个我们都愿意参加的新活动，试着从那里相遇。","我约你各自活动以后再分享见闻，让不同的兴趣也能带回共同的话题。"]},{"id":91,"title":"先别告诉我结局","body":"你们聊到刚开始看的书。对方知道后面的情节，却忍住没说：等你读到那里，我们再一起聊。","kind":"date","item":"一枚书签","choices":["约好读完的日子","告诉对方现在的猜测","各记一个问题，留到读完再交换"],"timing":{"min":0,"max":11},"memories":["我和你约好读完的日子，把结局留到那时再谈。","我告诉你现在的猜测，让还没读完的故事先有了讨论。","我和你各记一个问题，留到读完再交换，让等待也有自己的书签。"]},{"id":92,"title":"重复的日子也会不同","body":"连续几天都走同一条回家路。今晚对方带了一块小饼干，提议在平常经过的台阶上坐五分钟。","kind":"home","item":"路边五分钟","choices":["一起坐下来","分享今天最小的一件好事","换一条回家路，看看不熟悉的街角"],"timing":{"min":1,"max":120},"memories":["我和你一起坐下来，让重复的一天稍微停一停。","我讲了今天最小的一件好事，想让你也知道。","我提议换一条回家路，想和你看看重复日子旁边还有什么。"]},{"id":93,"title":"一起走向未知的一天","body":"一个新机会可能改变你们熟悉的生活。对方说还没有把握，但不想把担心藏起来。桌上摊着两座城市的地图。","kind":"dream","item":"新城市地图","choices":["一起列出需要解决的事","先去短住几天再决定","各写下最担心的事，再一起看"],"timing":{"min":6,"max":120},"memories":["我和你列出需要解决的事，让未知一点点有了轮廓。","我先和你去短住几天，想亲自看看再决定。","我和你各自写下最担心的事，把地图之外的顾虑也摊开。"]},{"id":94,"title":"今天先不解决所有事","body":"你觉得一天什么也没做好。对方放下自己的手机，问：陪你买点吃的，还是就在这里坐着？","kind":"home","item":"一顿简单的晚饭","choices":["一起出去买吃的","留在家里安静坐着","请对方陪我做完一件很小的事"],"timing":{"min":6,"max":120},"memories":["我和你出去买吃的，先把今天照顾好。","我留在家里和你安静坐着，没有催促一个答案。","我请你陪我做完一件很小的事，想先找回一点能够做到的感觉。"]},{"id":95,"title":"慢慢学会的一件事","body":"对方偷偷练了很久一门手艺。今天把第一件作品放到你面前，边角还有些歪，却认真选了你喜欢的颜色。","kind":"dream","item":"第一件手工作品","choices":["把它放在常用的位置","问下次能不能一起做","问练习时最难的是哪一步"],"timing":{"min":6,"max":120},"memories":["我把它放在常用的位置，让那份用心留在日常里。","我问下次能不能一起做，也想学会这一件小事。","我问你练习时最难的是哪一步，想认真看见礼物之前花过的时间。"]},{"id":96,"title":"你也喜欢这些旧东西","body":"旧货店里，你们同时拿起一张城市明信片。对方认出上面的旧车站，你认出旁边的书店，话题就这样接了下去。","kind":"encounter","item":"旧城市明信片","choices":["交换各自知道的小故事","邀请一起看看下一排货架","各挑一件旧物，讲讲为什么被吸引"],"timing":{"min":0,"max":0.1,"start":"new"},"memories":["我和你交换各自知道的小故事，让旧东西有了更多来历。","我邀请你一起看下一排货架，还想继续聊。","我和你各挑一件旧物，讲起被吸引的原因，慢慢认识彼此看东西的眼睛。"]},{"id":97,"title":"雨没有催我们回家","body":"散步时下起细雨。对方没有立刻加快脚步，而是问你冷不冷。街灯落在湿地上，回家的路还剩一点。","kind":"date","item":"雨夜街灯照片","choices":["撑伞再走一小段","找一家亮着灯的小店躲雨","先确认彼此冷不冷，再决定怎么走"],"timing":{"min":1,"max":120},"memories":["我撑着伞，和你又走了一小段。","我找了家亮着灯的小店，和你进去躲雨。","我先问清你冷不冷，也说出自己的感觉，让接下来的路照顾两个人。"]},{"id":98,"title":"一个只有你会摆的记号","body":"出差回来，你看见玄关的杯子旁边多了一张纸，上面画着共同相册封面的小记号。你认出了它，厨房里传来水声。","kind":"home","item":"杯柄的小暗号","choices":["也摆一个回应的记号","走进去打个招呼","把纸上的记号收进相册"],"timing":{"min":12,"max":120,"needs":"home","prior":142,"gap":12,"needsAll":["home","distance"]},"memories":["我也摆了一个记号，让你的暗号有了回应。","我走进去打了招呼，不再只隔着记号说话。","我把纸上的记号收进相册，让这次回来的欢迎也留下位置。"]},{"id":99,"title":"这次换我说那句话","body":"你总用一句小玩笑回应想念。今天对方先把那句话说了，语气模仿得很像。你才发现它已经成了两个人的习惯。","kind":"memory","item":"共同的口头习惯","choices":["接上下一句","认真说出玩笑里的真心","问对方是什么时候记住这个玩笑的"],"timing":{"min":12,"max":120},"memories":["我接上了下一句，让那个熟悉的玩笑继续。","我认真说出玩笑里的真心，不再借笑意遮过去。","我问你什么时候记住这个玩笑，想听听一句话怎样慢慢变成习惯。"]},{"id":100,"title":"只唱给你听的走调歌","body":"饭后洗碗时，对方忽然把勺子当话筒，唱了一句你喜欢的歌。唱错的地方还特意重来，说这次不许笑。","kind":"home","item":"厨房里的清唱","choices":["拿另一把勺子接唱","认真听完再鼓掌","给这场厨房演出起个名字"],"timing":{"min":6,"max":120,"needs":"home"},"memories":["我拿起另一把勺子接唱，把自己也放进这首走调的歌。","我认真听完再鼓掌，收下这场只唱给我的演出。","我给这场厨房演出起了个名字，让洗碗的晚上也有自己的节目单。"]},{"id":101,"title":"你随口说过的愿望","body":"你很久以前说想学乐器。生日时收到的不是昂贵礼物，而是一张体验课预约卡，旁边写着：不喜欢也可以换。","kind":"dream","item":"体验课预约卡","choices":["邀请对方一起去","先试一节再讲感受","先说说现在还想不想继续学"],"timing":{"min":6,"max":120},"memories":["我邀请你一起去，让那个随口说过的愿望有你的份。","我先试了一节，准备把真实的感受讲给你听。","我认真说起现在的想法，让你记住的愿望也有机会更新。"]},{"id":102,"title":"相处也可以提前商量","body":"约会几次后，对方问你喜欢每天聊天还是各忙各的再见面。问题很普通，你却第一次觉得可以不用靠猜。","kind":"date","item":"两人的相处约定","choices":["说出舒服的联系频率","先听听对方的习惯","约一个短期试行的节奏，过阵子再调整"],"timing":{"min":0,"max":11},"memories":["我说出让自己舒服的联系频率，把相处的节奏也拿来商量。","我先听听你的习惯，想知道你怎样度过一天。","我和你约好先试一种联系节奏，过一阵再调整，让亲近不必一次就定好规则。"]},{"id":103,"title":"那些小纸条没有被扔掉","body":"你以为随手写的提醒早就进了垃圾桶。整理抽屉时才发现，对方把它们折成同样大小，装在一个旧信封里。","kind":"memory","item":"装便条的旧信封","choices":["一起读几张过去的纸条","再写一张放进去","给纸条写下大致的日期"],"timing":{"min":6,"max":120},"memories":["我和你读了几张过去的纸条，重新遇见当时的我们。","我又写了一张放进去，让盒子里的日子接着往后长。","我替那些纸条补上大致的日期，让随手的提醒慢慢连成日常。"]},{"id":104,"title":"不知道名字也能聊很久","body":"你们在兴趣小组里用匿名账号聊天。对方分享一件不太敢告诉别人的事，又认真回复了你昨晚没讲完的话。","kind":"encounter","item":"第一次长聊天","choices":["也分享一点真实的自己","约一个双方舒服的见面方式","先说清哪些事暂时还不想谈"],"timing":{"min":0,"max":0.1,"start":"new"},"memories":["我也分享了一点真实的自己，没有只停在闲聊。","我约了一个双方都舒服的见面方式，让靠近不必勉强。","我说清暂时还不想谈的部分，让真实也包括能够安心保留的边界。"]},{"id":105,"title":"旁边的座位终于有人","body":"约定见面时，你以为对方不会来了。快到关门时间，旁边有人轻轻问：这里有人坐吗？声音和语音里的一样。","kind":"encounter","item":"迟到几分钟的车票","choices":["笑着让出旁边的位置","先问路上是不是遇到麻烦","先给对方一点喘口气的时间"],"timing":{"min":0,"max":0.1,"start":"new"},"memories":["我笑着让出旁边的位置，把这一小块空间留给你。","我先问路上是不是遇到了麻烦，想知道你来时的事。","我先让你坐下缓一缓，不急着把迟到的时间变成追问。"]},{"id":106,"title":"带一点自己种的东西给你","body":"对方拎来几颗自己种的番茄，有大有小。袋子上写了哪颗最甜，还提醒你别把里面那颗青的现在吃掉。","kind":"date","item":"手写番茄标签","choices":["一起尝一颗熟的","邀请对方教你种一盆","问问这几颗番茄种了多久"],"timing":{"min":1,"max":120},"memories":["我和你一起尝了一颗熟的，尝尝这段等待的滋味。","我请你教我种一盆，也想试着照顾一点会长大的东西。","我问起这些番茄种了多久，想知道袋子里还有怎样的一段等待。"]},{"id":107,"title":"重新种一棵","body":"你舍不得家附近被移走的老树。对方没有说别难过，而是提议在阳台种一株小苗，一起看它慢慢长。","kind":"home","item":"共同种的小树","choices":["一起选一个花盆","给它记下第一天的高度","一起了解小苗需要怎样照顾"],"timing":{"min":6,"max":120,"needs":"home"},"memories":["我和你一起选了一个花盆，给新的开始找个地方。","我记下它第一天的高度，留着以后慢慢比较。","我和你先了解小苗的需要，让重新种下的念头有可以持续的照顾。"]},{"id":108,"title":"教你的时候也会紧张","body":"对方教你一项自己擅长的技能，讲到一半突然卡住，承认平时会做，却不知道怎么教才不让你着急。","kind":"dream","item":"练习时的小笔记","choices":["说我们可以慢一点","换个更简单的步骤试试","说清哪一步没跟上，请再示范一次"],"timing":{"min":0,"max":11},"memories":["我说我们可以慢一点，让学习不必那么紧张。","我换了个更简单的步骤，想和你慢慢试。","我说清自己在哪一步没跟上，请你再示范一次，让紧张可以被具体地接住。"]},{"id":109,"title":"起飞之前那只手","body":"飞机开始滑行，你下意识抓紧扶手。对方没有开玩笑，问要不要牵手，或者一起数窗外的灯。","kind":"journey","item":"第一段航程的票根","choices":["牵住对方的手","一起数远处的灯","说想先自己缓一缓，请对方陪着就好"],"timing":{"min":1,"max":120},"memories":["我牵住你的手，陪你度过起飞前的这一刻。","我和你一起数远处的灯，让等待有件小事可做。","我说想先自己缓一缓，只请你陪着，不让关心变成必须接受的方式。"]},{"id":110,"title":"让你看见真正的家","body":"你有些犹豫要不要让对方到住处来。屋子不大，也没收拾得很好。对方说可以先在楼下买点吃的，听你的安排。","kind":"date","item":"第一次带回家的外卖单","choices":["邀请上楼坐坐","先在附近走一走","先约另一天，留时间整理自己"],"timing":{"min":0,"max":11},"memories":["我邀请你上楼坐坐，让你看看真实的生活。","我先和你在附近走了一走，慢慢靠近熟悉的地方。","我约了另一天，给自己一点准备的时间，让邀请从愿意开始。"]},{"id":111,"title":"道歉不是把事情翻过去","body":"对方为一次失约道歉，说清了原因，也承认当时应该早点告诉你。桌上的饭还热着，你可以慢慢决定怎么回应。","kind":"repair","item":"重新约定的时间","choices":["说出失约时自己的感受","一起定一个以后联系的办法","先听清以后遇到类似情况会怎么做"],"timing":{"min":6,"max":120},"memories":["我说出失约时的感受，没有把难过一笔带过。","我和你定下以后联系的办法，给下一次留一点确定。","我先听你以后遇到相同情况打算怎么做，想让道歉有下一次可以验证的改变。"]},{"id":112,"title":"认出聊天里那个你","body":"活动要求戴小面具。你们用事先约好的一个小动作相认，对方比划错了，自己先忍不住笑起来。","kind":"encounter","item":"活动面具","choices":["做对那个动作回应","直接笑着走过去","先走近，轻声确认是不是对方"],"timing":{"min":0,"max":0.1,"start":"new"},"memories":["我做了那个约好的动作，回应聊天里熟悉的你。","我直接笑着走过去，让屏幕里的交谈有了面对面。","我走近一点，轻声确认是不是你，让小小的暗号回到真实的声音里。"]},{"id":113,"title":"雨中把误会说完","body":"谈话刚开始就下起雨。你们挤在屋檐下，对方没有借机离开，而是接着说：刚才那件事，我还想听你讲完。","kind":"repair","item":"屋檐下的一次谈话","choices":["把真正介意的地方说出来","先一起找个能坐的地方","先把对方刚才的话复述一遍，确认没误解"],"timing":{"min":6,"max":120},"memories":["我说出真正介意的地方，想把误会讲清楚。","我先和你找了个能坐下的地方，让话慢慢说。","我先复述你刚才的话，想确认自己听懂了，再继续说自己的在意。"]},{"id":114,"title":"帮忙练习却先脸红","body":"你请对方帮忙练一次重要的自我介绍。练到如何介绍喜欢的人时，对方忽然停下来，说这一段怎么这么难。","kind":"date","item":"练习稿","choices":["轻轻问为什么难","也试着介绍一次对方","把难说的那段先写下来一起改"],"timing":{"min":0,"max":11},"memories":["我轻轻问为什么难，想听听那个停顿的缘由。","我也试着介绍了你一次，走进同样的紧张里。","我把难说的部分先写下来，和你一起改，让停顿也有可以接下去的方法。"]},{"id":115,"title":"终于为你挑一次礼物","body":"你们常帮彼此给朋友选礼物。今天对方说，这次想专门为你挑，不用你替别人考虑。你忽然不知道怎么回答。","kind":"date","item":"专门挑的小礼物","choices":["说出自己一直想要的小东西","邀请一起慢慢挑","说出自己更想一起度过的一段时间"],"timing":{"min":12,"max":120},"memories":["我说出一直想要的小东西，让你不用独自猜。","我邀请你一起慢慢挑，让挑选本身也成了相处。","我说起更想和你度过的一段时间，让礼物也可以是一件共同去做的事。"]},{"id":116,"title":"我最喜欢的长椅","body":"对方带你到一张不起眼的长椅，告诉你以前心烦就坐在这里。你们并排坐下，等一辆很慢的车从眼前经过。","kind":"date","item":"长椅附近的一片叶子","choices":["问以前常想些什么","分享自己类似的地方","先安静坐一会儿，不急着问"],"timing":{"min":0,"max":11},"memories":["我问你以前常想些什么，想听听这张长椅留住的日子。","你说起那张长椅，我也讲起自己愿意独自待着的地方。在认识彼此以前，我们都曾有这样安静的角落。","我先和你安静坐一会儿，想感受这张长椅曾经怎样陪过你。"]},{"id":117,"title":"你可以再试一次","body":"你说想重新做以前喜欢的事，又担心已经太晚。对方把空白纸推过来，问：要不要先做最小的一步？","kind":"dream","item":"重新开始的第一页","choices":["现在写下第一步","请对方下周提醒你","把担心列出来，先找最容易解决的一项"],"timing":{"min":6,"max":120},"memories":["我现在就写下第一步，让想做的事有一个小小的开始。","我请你下周提醒我，把这份念头留到日历的下一页。","我把担心写下来，先找最容易解决的一项，让重新开始有一个不那么难的入口。"]},{"id":118,"title":"踩错拍也能跳完","body":"你们一起学舞，最简单的转身总会碰脚。练到第五遍，对方索性先笑出来，问要不要休息两分钟。","kind":"date","item":"练舞的短视频","choices":["休息后慢慢再试","把错误动作编成自己的舞步","请对方把动作拆慢一点一起练"],"timing":{"min":1,"max":120},"memories":["我休息以后又慢慢试了一次，没有急着放弃。","我把错掉的动作编进舞步，留下只属于我们的跳法。","我请你把动作拆慢一点，和你从最小的一步重新合拍。"]},{"id":119,"title":"没有拿奖也要吃顿好的","body":"你们参加的小比赛成绩很普通。走出门，对方却举起手来和你击掌：至少最后一段，我们真的一起完成了。","kind":"dream","item":"没有名次的参赛证","choices":["庆祝终于完成","聊聊下次想改进哪里","把一起完成的那一段记下来"],"timing":{"min":1,"max":120},"memories":["我庆祝终于完成这件事，结果之外也有值得记住的部分。","我聊起下次想改进的地方，让这次经历接得上以后。","我把终于一起完成的那段记下来，不让普通的成绩盖住共同做过的事。"]},{"id":120,"title":"轮流进入彼此的世界","body":"今天上午看你喜欢的展，下午去对方常去的小馆。你们各自当一次向导，也各自问一些不太专业的问题。","kind":"date","item":"两张不同的门票","choices":["认真听对方介绍","坦白一个自己没看懂的地方","各挑一个最想带给对方的细节"],"timing":{"min":0,"max":120},"memories":["我认真听你介绍，试着进入你熟悉的世界。","我坦白有个地方没看懂，愿意从这里重新听。","我和你各挑一个最想分享的细节，让今天的两个世界有清楚的交点。"]},{"id":121,"title":"你画的小图案还在","body":"多年后，对方的新工作室开门。门边挂着你们相册封面上的小图案，线条稍微修过，最笨的那个细节却没改。","kind":"memory","item":"旧图案的新招牌","choices":["站在招牌前合影","问为什么保留相册上的图案","给图案拍张近照，放回共同相册"],"timing":{"min":60,"max":120,"prior":142,"gap":48},"memories":["我站在招牌前和你合影，把共同相册里的图案也留在今天。","我问你为什么把相册里的图案留在这里，想听听这些年它对你的意义。","我拍下图案的近照，把它放回共同相册，让曾经的一笔接上今天的新地方。"]},{"id":122,"title":"一首歌里藏着两个人","body":"你们给一段简单旋律编了自己的词。别人听不出意思，只有你知道里面那句奇怪的话来自第一次一起做饭。","kind":"home","item":"共同编的小曲","choices":["添上最近的一件小事","录成一段完整的声音","给这首歌取一个只有我们懂的名字"],"timing":{"min":6,"max":120,"needs":"home","prior":100,"gap":3},"memories":["我添上最近的一件小事，让歌里有现在的我们。","我把它录成一段完整的声音，留住两个人的部分。","我给这首歌取了个只有我们懂的名字，把做过饭的日子也收进旋律。"]},{"id":123,"title":"听见前奏就知道是谁","body":"心情有些僵的晚上，对方在另一间屋里哼起你们熟悉的旋律，唱到两人常接的地方，故意停了下来。","kind":"repair","item":"停在半句的旋律","choices":["轻轻接上后半句","走过去说想认真聊聊","先告诉对方自己还需要一点时间"],"timing":{"min":6,"max":120,"needs":"home","prior":172,"gap":6},"memories":["我轻轻接上后半句，让熟悉的前奏有了回应。","我走过去说想认真聊聊，不再只让旋律替我们说话。","我告诉你自己还需要一点时间，也让你知道这句话并不是拒绝继续聊。"]},{"id":124,"title":"送到门口还在高兴","body":"你们道别后，你回头看了一眼。对方正轻轻踢着路边的小石子，嘴角还没放下，发现你在看又立刻站直了。","kind":"date","item":"门口的晚安消息","choices":["笑着再挥一次手","发消息说刚才看见了","把此刻的高兴记进当天的日记"],"timing":{"min":0,"max":11},"memories":["我笑着又挥了一次手，舍不得把告别省略。","我发消息说刚才看见了，让门口的快乐有了回音。","我把此刻的高兴记进日记，想留住告别之后仍没有收起来的笑。"]},{"id":125,"title":"第一次并排印着名字的位置","body":"共同的小项目终于完成。展示页上没有名字，只有“我们一起做的”。你们站在旁边拍照，手上还沾着最后一点胶水。","kind":"dream","item":"完成作品的照片","choices":["拍一张认真的纪念照","也留下一张没收拾好的现场照","把制作过程的照片也一起收好"],"timing":{"min":6,"max":120},"memories":["我拍了一张认真的纪念照，记下名字第一次并排的地方。","我也留下没收拾好的现场照，把忙乱一起记住。","我把制作过程的照片一起收好，让完成之外也留下那些还没做好的时刻。"]},{"id":126,"title":"给未来的小事取名字","body":"你们给还没养的植物、还没开的店，甚至以后可能住的小屋起名字。一个比一个离谱，谁也没认真否决。","kind":"home","item":"未来小屋的名字清单","choices":["选一个最喜欢的记下来","继续想几个好笑的名字","各选一个名字，写下喜欢它的原因"],"timing":{"min":6,"max":120},"memories":["我选了最喜欢的那个名字记下，先把未来的一小部分留在纸上。","我继续想了几个好笑的名字，陪你把想象说下去。","我和你各选一个名字，写下喜欢的原因，让玩笑里也看得见两个人的期待。"]},{"id":127,"title":"今天回到你身边","body":"和旧识见面后，你回到熟悉的门口。对方刚好买菜回来，把袋子往旁边换了一只手，腾出手来牵你。","kind":"home","item":"今晚的买菜小票","choices":["牵手一起上楼","讲一件今天想起的旧事","接过一部分菜，和对方一起回去"],"timing":{"min":6,"max":120,"needs":"home"},"memories":["我牵着你的手一起上楼，把今天带回家。","我讲起今天想起的一件旧事，让从前也陪我们待一会儿。","我接过一部分菜，和你一起往回走，让回到身边落在手里这一点重量上。"]},{"id":128,"title":"捡到一页写满改动的纸","body":"活动散场，你发现一页对方掉落的草稿，边上写着很多修改。归还时你提起喜欢其中一句，对方很意外你认真看了。","kind":"encounter","item":"一页创作草稿","choices":["说说喜欢它的原因","请对方介绍正在做的作品","先把草稿完整归还，约以后再听介绍"],"timing":{"min":0,"max":0.1,"start":"new"},"memories":["我说起喜欢它的原因，认真看待那页改了又改的纸。","我请你介绍正在做的作品，想听你亲自讲。","我先把草稿好好归还，约你以后再讲，让认真看见也保留不打扰的分寸。"]},{"id":129,"title":"推门听见熟悉的旋律","body":"你把没完成的旋律发过给对方。后来去见面，门还没推开就听见那段旋律，被认真练成了完整的一小段。","kind":"dream","item":"被接完的旋律","choices":["和对方一起补完结尾","先听完整一遍","问对方愿不愿意讲讲怎么练的"],"timing":{"min":6,"max":120},"memories":["我和你一起补完结尾，让熟悉的旋律继续下去。","我先完整听了一遍，没有打断这一段重逢。","我请你讲讲怎么练这段旋律，想认识门后那些没有被我听见的时间。"]},{"id":130,"title":"人群里忽然安静","body":"热闹聚会里，你们隔着人群对上视线。有人经过挡住了几秒，再看见时，对方仍朝你这边望着。","kind":"encounter","item":"聚会的入场贴纸","choices":["走过去打招呼","先举杯示意","给对方发一句只有此刻懂的消息"],"timing":{"min":0,"max":0.1,"start":"new"},"memories":["我走过去打了招呼，不再隔着人群。","我先举杯示意，让你知道我也看见了你。","我给你发了一句只有此刻懂的消息，让人群里的那次对视有了回应。"]},{"id":131,"title":"在橱窗前排练未来","body":"经过一家布置温暖的家居店，你们停在橱窗外。对方问，假如住在这里，早餐谁先起？你们开始认真胡说。","kind":"date","item":"橱窗前的随手照","choices":["接着想象一个早晨","聊聊现实里想要的生活","各说一件现实里不想放弃的习惯"],"timing":{"min":6,"max":120},"memories":["我接着想象一个早晨，把橱窗里的未来讲得更近一点。","我聊起现实里想要的生活，让想象也有可以落脚的地方。","我和你各说一件不想放弃的习惯，让想象中的家容得下真实的我们。"]},{"id":132,"title":"一支很慢的舞","body":"家里没有舞池。对方把椅子挪开，问能不能借三分钟。你们在窄窄的客厅里转身，谁都不敢迈太大步。","kind":"home","item":"客厅三分钟","choices":["把手递过去","先选一首都喜欢的歌","说今天不想跳，改为一起听歌"],"timing":{"min":6,"max":120,"needs":"home"},"memories":["我把手递过去，和你进入这支很慢的舞。","我先选了一首我们都喜欢的歌，让开始从熟悉的旋律里来。","我说今天不想跳，想和你一起听歌。靠近也可以换一种都舒服的方式。"]},{"id":133,"title":"想回家就回去看看","body":"你想抽几天回老家，又担心打乱共同计划。对方说可以重新排，还问要不要帮忙照顾你留下的植物。","kind":"home","item":"重新排的日历","choices":["坦白说出自己的牵挂","一起调整这周的安排","自己先排一版，再请对方一起看"],"timing":{"min":6,"max":120},"memories":["我坦白说出自己的牵挂，没有假装不想家。","我和你调整这周的安排，给想念留出时间。","我先排出一版安排，请你一起看看，让牵挂和共同计划都有地方安放。"]},{"id":134,"title":"终于等到灯亮","body":"你一直想看河边灯会。真正到场时人比想象中多，对方找了不那么挤的一段岸边，陪你等第一盏灯亮。","kind":"journey","item":"灯会的小票","choices":["静静等着看灯","给这个晚上拍一张照片","问对方要不要轮流去买点热饮"],"timing":{"min":1,"max":120},"memories":["我静静等着灯亮，没有催促这个晚上。","我给这个晚上拍了张照片，留住等待的样子。","我问你要不要轮流买点热饮，把等待灯亮的时间也照顾得暖一点。"]},{"id":135,"title":"一个很少告诉别人的称呼","body":"散步时，对方告诉你小时候的一个昵称，讲完又补充：只有很熟的人才这样叫。你认真记住了发音。","kind":"date","item":"一个私密称呼","choices":["问能不能也这样叫","分享自己的小秘密","记住这个称呼，先不急着用"],"timing":{"min":0,"max":11},"memories":["我问能不能也这样叫你，小心靠近那个少有人知道的称呼。","我也讲了自己的小秘密，让这份亲近有来有回。","我把那个称呼认真记住，先不急着叫出口，想让熟悉有自己的速度。"]},{"id":136,"title":"后来才看见的照顾","body":"你翻照片才发现，上次出游每当你睡着，对方都会替你把快滑下去的围巾拉回来。照片是朋友随手拍到的。","kind":"memory","item":"一张没有摆拍的照片","choices":["把照片发给对方道谢","也说起自己记住的一次照顾","把这张照片放进共同的相册"],"timing":{"min":6,"max":120},"memories":["我把照片发给你道谢，补上当时没来得及发现的照顾。","我也说起自己记住的一次照顾，让你知道我没有忘。","我把那张记录照顾的照片收进共同相册，不让后来才发现的温柔再错过一次。"]},{"id":137,"title":"两束光追上彼此","body":"海边夜市卖小手电。你们把光点投在墙上，先是追来追去，后来一起绕着同一圈慢慢转。","kind":"date","item":"两支小手电","choices":["让自己的光等一等对方","一起画一个简单图案","把光点停在墙上，邀请对方来找到它"],"timing":{"min":0,"max":120},"memories":["我让自己的那束光停了一停，等你跟上。那是个很小的动作，我却想把它记下来。","我和你一起画了个简单图案，让两束光有了共同的形状。","我把光点停在墙上，邀请你来找到它，让追逐也可以变成一次安静的等待。"]},{"id":138,"title":"理想之外的那个人","body":"你原以为喜欢的人应该很会说话。真正相处时，对方有点笨拙，却会记得等你把每句话讲完。","kind":"memory","item":"一次不被打断的谈话","choices":["说出被认真听见的感觉","问问对方的心事","说出自己也有的笨拙"],"timing":{"min":0,"max":11},"memories":["我说出被认真听见的感觉，想让你知道这对我很重要。","我问起你的心事，也想好好听你讲。","我也说出自己的笨拙，不再只拿想象中的样子衡量眼前的我们。"]},{"id":139,"title":"仪式之后的第二天","body":"热闹的纪念日结束，第二天你们仍要倒垃圾、买牙膏。对方在超市认真比较两种面包，忽然问你要不要都试试。","kind":"home","item":"两种口味的面包","choices":["各选一种回去分享","买常吃的再加一个新口味","选最简单的一种，把时间留给一起吃"],"timing":{"min":12,"max":120,"needs":"home"},"memories":["我和你各选了一种，带回去一起分享。","我买了常吃的，又添一个新口味，让熟悉里有一点新鲜。","我选了最简单的一种面包，把时间留给和你一起吃的早晨。"]},{"id":140,"title":"归还一副手套","body":"你在小店发现遗落的手套，交给店员。失主回来后特意追出来道谢，手套还没戴好，就先向你伸出一只空手。","kind":"encounter","item":"归还物品的小便签","choices":["停下来聊几句","接受一杯热饮的邀请","说今天赶时间，约以后有机会再聊"],"timing":{"min":0,"max":0.1,"start":"new"},"memories":["我停下来和你聊了几句，没有只把手套收好就走。","我接受了那杯热饮的邀请，给这次相遇多留一点时间。","我说明今天赶时间，也留下以后再聊的可能，让这次感谢不必急着变成什么。"]},{"id":141,"title":"餐厅里找到彼此","body":"你晚到了一会儿，站在门口找位置。对方越过几张桌子看见你，没有催，只把笑容慢慢放开。","kind":"date","item":"靠窗桌的号码","choices":["走过去说说路上的事","先给对方一个拥抱","坐下先问对方等候时做了什么"],"timing":{"min":0,"max":120},"memories":["我走过去讲起路上的事，把寻找你的那段路也分享给你。","我先给了你一个拥抱，让见面从这里开始。","我坐下问你等候时做了什么，想把自己没在的这一小段也听进来。"]},{"id":142,"title":"藏在角落里的小记号","body":"你们给共同的相册做封面。对方把一个很小的符号画在角落，那是只有你们才知道的某一天。","kind":"memory","item":"带暗号的相册","choices":["也添一个新的小记号","写下这个符号的来历","在相册扉页写一句今天的话"],"timing":{"min":6,"max":120},"memories":["我也添了一个新的小记号，让角落继续记住我们。","我写下这个符号的来历，留给以后慢慢读。","我在相册扉页写下今天的一句话，让封面之外也有此刻的我们。"]},{"id":143,"title":"音乐响起的那一秒","body":"商店里突然播到你们旅行时常听的旋律。对方没说话，只看了你一眼。你也刚好在想同一个傍晚。","kind":"memory","item":"一首旧旋律","choices":["问还记得那天吗","停下来听完这一小段","记下歌名，留到回去一起听"],"timing":{"min":12,"max":120,"prior":12,"gap":6},"memories":["我问你还记不记得那天，让一小段音乐牵回旧事。","我停下来听完这一小段，让往事暂时近一点。","我记下歌名，约你回去一起听，把忽然回来的那段旅程多留一会儿。"]},{"id":144,"title":"多出来的三天","body":"出差结束，行程意外空出三天。对方问要不要一起留在这座小城，不赶景点，只找地方走走和吃饭。","kind":"journey","item":"三天的空白行程","choices":["留下慢慢走","安排一个想去很久的小地方","先问彼此想怎样休息，再决定去留"],"timing":{"min":6,"max":120},"memories":["我留了下来，想和你慢慢走完多出来的三天。","我安排了一个惦记很久的小地方，把多出的时间交给它。","我先问你想怎样休息，也说出自己的状态，让多出的三天不用急着填满。"]},{"id":145,"title":"电话里又听见那个称呼","body":"隔了很久才接通电话，你们先客气地问好。说到一半，对方不经意用了以前的昵称，两个人都停了一下。","kind":"distance","item":"一通久别电话","choices":["用熟悉的称呼回应","说刚才听见时有点想念","问对方还喜欢被这样称呼吗"],"timing":{"min":6,"max":120,"needs":"distance"},"memories":["我用熟悉的称呼回应，让电话两端接上从前。","我说刚才听见的时候有点想念，没有把这句话藏起来。","我问你现在还喜不喜欢那个称呼，让从前的熟悉也认真经过今天。"]},{"id":146,"title":"先接住这份难过","body":"谈到接下来如何相处，你突然说不下去。对方也还没想好答案，只问现在能不能抱一下你。","kind":"repair","item":"一次没有标准答案的拥抱","choices":["接受这个拥抱","说想先坐一会儿","说清现在能接受怎样的陪伴"],"timing":{"min":6,"max":120},"memories":["我接受了这个拥抱，先让难过有地方可放。","我说想先坐一会儿，暂时不急着开口。","我说清现在希望怎样被陪伴，让难过不必靠对方猜出唯一的答案。"]},{"id":147,"title":"那件旧衣还在","body":"整理衣柜时，你发现对方一直留着第一次一起旅行穿的旧外套。口袋里居然还有一张皱掉的车票。","kind":"memory","item":"旧外套口袋里的车票","choices":["一起回忆那趟旅行","把票根放进回忆盒","问那件外套现在还想不想继续穿"],"timing":{"min":12,"max":120,"prior":7,"gap":12},"memories":["我和你一起回忆那趟旅行，让旧衣上的日子重新清楚。","我把票根放进回忆盒，让它和从前的我们待在一起。","我问你那件外套还想不想继续穿，让留下的东西也有今天的用处。"]},{"id":148,"title":"你怎样对待小生命","body":"路边一只小动物被困住。对方没有急着抱它，而是蹲下来等它平静，再找来懂照料的人帮忙。你第一次看见这种耐心。","kind":"date","item":"一张小动物的照片","choices":["陪着一起等","帮忙联系可以协助的人","先退开一点，给小动物安静的空间"],"timing":{"min":0,"max":11},"memories":["我陪着一起等，没有先离开。","我帮忙联系能协助的人，接过眼前能做的那一点。","我先退开一点，让小动物有安静的空间，也认真看你怎样耐心等待。"]},{"id":149,"title":"第二把钥匙","body":"对方把一把新钥匙放在你掌心。没有隆重仪式，只说：如果你愿意，这边那个抽屉已经空出来了。","kind":"home","item":"第二把家门钥匙","choices":["一起讨论搬进来的时间","先商量各自需要的空间","先保留钥匙给临时需要，暂不搬家"],"timing":{"min":6,"max":120},"memories":["我和你讨论搬进来的时间，让第二把钥匙有了具体的日子。","我先商量各自需要的空间，想把两个人都安顿好。","我先把钥匙作为临时需要时的准备，说明自己暂不搬家。信任也可以一步一步来。"]},{"id":150,"title":"回家的路再长一点","body":"骑车回去时，对方指了指河边的路：这边会慢十分钟。你们都没有必须赶回去的理由。","kind":"date","item":"多出来的十分钟","choices":["沿河边慢慢骑","停下来推着车走","先确认时间，约好走到哪儿就回头"],"timing":{"min":1,"max":120},"memories":["我沿河边慢慢骑，把回家的路留长一点。","我停下来推着车走，和你慢慢走完这一段。","我和你约好走到哪里就回头，让绕远也有照顾彼此安排的分寸。"]},{"id":151,"title":"录音里还有当时的笑声","body":"你们听起之前留下的一段录音。声音里连谁先笑、谁接错了拍子，都还清清楚楚。","kind":"memory","item":"第一次聊天的录音","choices":["一起听完","录下今天对那时的回应","记下听到的一个新细节"],"timing":{"min":12,"max":120,"gap":6,"priorChoices":[{"id":12,"index":1},{"id":14,"index":1},{"id":63,"index":1}]},"memories":["我和你一起听完，让当时的笑声重新经过今天。","我录下今天的回应，把现在的我们接到那段声音后面。","我记下重听时才发现的细节，原来旧声音里还藏着没有听清的我们。"]},{"id":152,"title":"原来你也会这么大声","body":"你陪对方看一场不熟悉的比赛。对方教你什么时候欢呼。第一次喊出声，你们都笑了，紧张也跟着散掉。","kind":"date","item":"比赛纸旗","choices":["放开声音一起喊","请对方继续解释规则","先观察一会儿，再问最不懂的地方"],"timing":{"min":0,"max":11},"memories":["我放开声音和你一起喊，走进这场热闹。","我请你继续解释规则。原来熟悉一个人，也包括慢慢听懂让你大声欢呼的事情。","我先看了一会儿，再问最不明白的地方，慢慢走近让你热闹起来的世界。"]},{"id":153,"title":"以前教你的终于用上了","body":"车站人很多，你一时找不到对方。忽然听见那段你们曾一起配合过的旋律，回头就看见那人抬起了手。","kind":"journey","item":"车站的小暗号","choices":["用同样的旋律回应","走过去把手牵好","走到显眼处，发位置让对方过来"],"timing":{"min":12,"max":120,"prior":172,"gap":6},"memories":["我用同样的旋律回应，接住我们曾经一起合过的拍子。","我走过去牵好你的手，把回应放在掌心里。","我走到显眼的位置，把位置发给你，让人群里的寻找有一个确定的落点。"]},{"id":154,"title":"原来小时候就碰过面","body":"聊天时你们发现参加过同一场童年活动。各自翻出旧照片，角落里真的有另一个模糊的小身影。","kind":"memory","item":"两张童年旧照片","choices":["一起找更多当年的细节","给现在的你们拍张合照","把两张旧照片放在一起保存"],"timing":{"min":0,"max":120},"memories":["我和你一起找更多当年的细节，看看从前还藏着多少交集。","我给现在的我们拍了张合照，让这次相遇有清楚的凭据。","我把两张旧照片放在一起，让模糊的交集有了能慢慢看的地方。"]},{"id":155,"title":"在亲友面前自然靠近","body":"聚会音乐响起，对方向你伸出手。有人微笑，有人继续聊天。你发现这一刻没有想象中那么郑重，只是很自然。","kind":"home","item":"亲友聚会合影","choices":["和对方慢慢跳一会儿","先并肩坐着听完一首歌","笑着说明想先坐着，请对方随意"],"timing":{"min":1,"max":120},"memories":["我和你慢慢跳了一会儿，在熟悉的人面前自然靠近。","我先和你并肩坐着，听完一首歌。","我说明自己想先坐着，也请你按自己的心情来，不让亲近变成必须同步的动作。"]},{"id":156,"title":"肩膀有点酸吗","body":"走了一天路，你转了转肩膀。对方问要不要帮忙按一会儿，又把热毛巾递过来，说不舒服就随时停。","kind":"home","item":"一条热毛巾","choices":["请对方轻轻按一会儿","先用热毛巾敷一下","说暂时不用，先自己伸展一下"],"timing":{"min":6,"max":120},"memories":["我请你轻轻按一会儿，把肩膀上的酸意交给你。","我先用了热毛巾，慢慢照顾这点疲惫。","我说暂时不用，先自己伸展一下，也认真谢过你的留意。"]},{"id":157,"title":"楼下的一支慢舞","body":"楼下有人放老歌。你们提着买好的菜，停在一旁晃了两步。对方怕压坏番茄，把袋子小心放到长椅上。","kind":"home","item":"晚饭前的一首歌","choices":["把这支舞跳完","坐下听完再回家","先把菜送回去，再下来听一会儿"],"timing":{"min":6,"max":120,"needs":"home"},"memories":["我和你把这支舞跳完，没有急着回家。","我坐下听完才回家，让旋律有一个完整的结尾。","我提议先把菜送回去，再下来听一会儿，让日常和那支老歌都不被匆忙放掉。"]},{"id":158,"title":"天亮前一起出门","body":"去湖边的路还很暗。对方带了热水，你带了没吃完的面包。到岸边时第一道光刚好从水面上来。","kind":"journey","item":"日出时的面包袋","choices":["并肩坐下看天亮","分享热水和面包","各自安静看一会儿，再分享看见的东西"],"timing":{"min":1,"max":120},"memories":["我和你并肩坐下看天亮，等夜色慢慢退去。","我和你分享热水和面包，把清晨过成两个人的早餐。","我和你先安静看天亮，再分享各自注意到的东西，让同一片光有两种看法。"]},{"id":159,"title":"先陪你坐到下一站","body":"你要去外地，对方还没准备好改变生活。送站时，对方临时买了一段短途票，说：先陪你坐到下一站。","kind":"distance","item":"多坐一站的车票","choices":["珍惜这段短短的同行","说好下次换自己过来","约好到站后的第一通电话"],"timing":{"min":6,"max":120,"needs":"distance"},"memories":["我认真珍惜这段短短的同行，没有把它当作顺路而已。","我说好下次换自己过来，让赶路这件事也有来有回。","我和你约好到站后的第一通电话，把这一小段同行接到离开以后。"]},{"id":160,"title":"借书记录里的交集","body":"你们在阅读小组里发现最近借过几本相同的书。对方喜欢的页码与你不同，你忽然想知道为什么。","kind":"encounter","item":"共同读过的书单","choices":["交换各自划线的句子","约读下一本同样的书","一起找一本两个人都没读过的书"],"timing":{"min":0,"max":0.1,"start":"new"},"memories":["我和你交换各自划线的句子，看看同一本书怎样留下不同的痕迹。","我约你读下一本同样的书，把交集延到下一页。","我和你找了一本都没读过的书，让共同的阅读从未知的一页开始。"]},{"id":161,"title":"翻到背面才看见自己","body":"一张旧便签背面画着你低头看书的样子。线条很简单，却连你习惯卷起的袖子都画了。","kind":"memory","item":"背面的速写","choices":["问对方什么时候画的","也给对方画一张","把便签夹进当时读过的那本书"],"timing":{"min":12,"max":120},"memories":["我问你是什么时候画的，想知道自己没看见的那一刻。","我也给你画了一张，让纸上不只有我。","我把便签夹进那本书里，让被画下的自己回到那段阅读的时间。"]},{"id":162,"title":"再讲一次我们的开始","body":"一个普通晚上，对方忽然问：你还记得第一次见面吗？你讲到某个细节，对方立刻纠正，又笑着说自己当时其实很紧张。","kind":"memory","item":"两种版本的初遇","choices":["把两种版本都记下来","追问当时没有说出的想法","写下自己最确定记得的那一幕"],"timing":{"min":12,"max":120},"memories":["我把两种版本都记了下来，允许开始有两个人的记忆。","我追问当时没有说出的想法，想把那一天听得更完整。","我写下最确定记得的那一幕，让不同版本都能有自己的证词。"]},{"id":163,"title":"原来你也主动过","body":"翻看这一路的回忆时，对方说有一次所谓的顺路，其实提前绕了很远。你一直以为那天只是巧合。","kind":"memory","item":"一段绕远的路线","choices":["说出自己也藏过的小心思","谢谢那天的主动靠近","问还有哪一次顺路有别的心思"],"timing":{"min":12,"max":120},"memories":["我也说出藏过的小心思，让那次相遇不再只有一面的故事。","我谢谢你那天主动靠近，让我们没有就此错过。","我问还有哪一次顺路藏着别的心思，想把当时没看见的你慢慢读完。"]},{"id":164,"title":"为了多聊一句","body":"你常去的小书店里，总能遇见同一个人。今天对方认出了你手里上次没买的书，问后来读了吗。","kind":"encounter","item":"一本聊过的书","choices":["接着聊这本书","推荐一本自己喜欢的","问对方最近在读什么"],"timing":{"min":0,"max":0.1,"start":"new"},"memories":["我接着聊这本书，给交谈多留一句的时间。","我推荐了一本自己喜欢的书，想把另一个话题也交给你。","我问你最近在读什么，让再多聊一句从你的这一页开始。"]},{"id":165,"title":"借伞留下下次见面的理由","body":"雨把你困在门口。对方找来一把备用伞，伞骨有一点歪，却撑得很好。你说下次还回来，对方点头说不急。","kind":"encounter","item":"借来的伞","choices":["约一个归还的日子","认真道谢并留个联系方式","先问哪里方便归还，不急着约见面"],"timing":{"min":0,"max":0.1,"start":"new"},"memories":["我约好归还的日子，让这把伞连着下一次见面。","我认真道谢，也留下了联系方式。","我先问清哪里方便归还，让借来的伞有妥当的去处，也让相遇保留余地。"]},{"id":166,"title":"低头发现鞋子一样","body":"聊天还没完全热起来，你们同时发现穿了同款鞋。对方抬起脚给你看鞋边一块旧污渍，你也有一块差不多的。","kind":"encounter","item":"同款鞋的合影","choices":["笑着讲鞋子的来历","问还喜欢哪些相同的东西","给两双鞋拍一张并排的照片"],"timing":{"min":0,"max":0.1,"start":"new"},"memories":["我笑着讲起鞋子的来历，把巧合接成一个小故事。","我问你还有哪些相同的喜欢，想再多认识一点。","我给两双鞋拍了张并排的照片，把话题还没热起来时的巧合留下。"]},{"id":167,"title":"礼物拆开居然一样","body":"两个人各自藏好的礼物在桌上同时拆开，竟然是同一款小东西。对方愣了两秒，提议一人留一种包装。","kind":"home","item":"两份相同的小礼物","choices":["交换包装留下各自心意","拍下这个巧合","约定一起使用这两份礼物"],"timing":{"min":12,"max":120},"memories":["我和你交换包装，把各自准备过的心意都留下。","我拍下这个巧合，记住礼物拆开时的相同。","我约你一起用这两份相同的礼物，让巧合也走进以后的日常。"]},{"id":168,"title":"同一件事不同的心情","body":"你以为今天只是一次普通散步，对方却有点舍不得结束。问过才知道，这是忙碌前难得空出的一个完整下午。","kind":"date","item":"一个完整的下午","choices":["把剩下的时间留给彼此","认真约好下次见面的时间","先确认对方愿意怎样度过剩下的时间"],"timing":{"min":6,"max":120},"memories":["我把剩下的时间留给彼此，先顾眼前的相处。","我认真约好下次见面的时间，给等待一个确定的日子。","我问你想怎样过剩下的时间，不再只按自己以为的普通散步来安排。"]},{"id":169,"title":"给你画一张不完美的像","body":"旅行快结束时，对方拿出小本子要给你画肖像。鼻子画了三遍都不对，最后你们决定把最不像的一版留下。","kind":"journey","item":"一张不太像的肖像","choices":["也给对方画一张","替这幅画认真签日期","给那张不像的肖像取一个名字"],"timing":{"min":1,"max":120},"memories":["我也给你画了一张，不求多像，只想把你留下。","我认真替这幅画签上日期，让不完美也值得纪念。","我给那张不像的肖像取了个名字，把笑出来的过程也当作它的一部分。"]},{"id":170,"title":"写在掌心的不是提醒","body":"你借笔给对方，以为是记一个地址。对方却在自己掌心写了一个小小的邀请，摊开给你看：今晚散步？","kind":"date","item":"掌心邀请的照片","choices":["在自己手上写下回应","直接牵手表示答应","说明今晚的安排，另约一个能安心散步的时间"],"timing":{"min":0,"max":11},"memories":["我在自己手上写下回应，把话留在掌心。","我直接牵了手，用这个动作答应你。","我说清今晚的安排，另约一个从容的时间，不让答应只停在掌心。"]},{"id":171,"title":"这一次两个人都回头","body":"你们在街上认出彼此，却又不太确定。擦肩几步后，你转过头，对方也刚好停下来。","kind":"encounter","item":"街角重逢的日期","choices":["主动走回去","笑着先打个招呼","轻声叫住对方，确认有没有认错"],"timing":{"min":0,"max":0.1,"start":"new"},"memories":["我主动走了回去，不想只停在回头的那一眼。","我笑着先打了招呼，把这一秒接下去。","我轻声叫住你，认真确认这次相认，不想让回头只留在猜测里。"]},{"id":172,"title":"你开始我就接上","body":"对方说自己会一点乐器，你说会一点唱歌。第一次配合不太整齐，唱到后面却自然而然慢成同一个速度。","kind":"date","item":"第一次合奏录音","choices":["再来一遍熟悉的部分","试着编一个新结尾","先录一小段，听听哪里需要调整"],"timing":{"min":0,"max":11},"memories":["我和你又来了一遍熟悉的部分，重温接得上的默契。","我试着编一个新结尾，让熟悉的故事也能往前走。","我先录了一小段，和你听听哪里需要调整，让合拍也有可以慢慢学的方法。"]},{"id":173,"title":"早回来一天","body":"原定明天才到的人，清晨发来消息：楼下有热早餐。你拉开窗帘，对方正小心护着怕凉的纸袋。","kind":"distance","item":"清晨早餐纸袋","choices":["赶快下楼见面","请对方上来一起吃","说明自己还要准备，请对方先找地方坐"],"timing":{"min":6,"max":120,"needs":"distance"},"memories":["我赶快下楼见你，让提早的一天变成此刻。","我请你上来一起吃，让突然的见面落在一顿饭里。","我说清自己还要一点时间，请你先坐下等，不让惊喜变成匆忙。"]},{"id":174,"title":"出门前的备用钥匙","body":"你独自去办一件有点紧张的事。对方把路线和备用钥匙交给你，说回来晚也没关系，灯会留着。","kind":"home","item":"备用钥匙上的小挂件","choices":["接受这份准备","告诉对方办完会发消息","先确认备用钥匙什么时候需要归还"],"timing":{"min":6,"max":120,"needs":"home"},"memories":["我接受了这份准备，把备用钥匙收下。","我告诉你办完会发消息，不让你一直惦记。","我先确认钥匙什么时候归还，想把接受的照顾也处理得妥当。"]},{"id":175,"title":"带着家一起出发","body":"你们终于有了一段长假。收行李时，对方把常用的小杯子也放进去，说这样到了哪里，早晨都还是熟悉的。","kind":"journey","item":"跟着旅行的杯子","choices":["再带一件共同的小物","留一点空间给新的纪念品","给行李分区，留出两个人各自的空间"],"timing":{"min":12,"max":120,"needs":"home"},"memories":["我又带了一件共同的小物，让行李里多一点家的样子。","我留了一点空间，给路上还没遇见的纪念品。","我把行李分好区，让一起出发的箱子也有两个人各自的位置。"]},{"id":176,"title":"原来你都记得","body":"和朋友吃饭时，对方很自然地记起你喜欢的温度、怕冷的位置和不太能吃的调料。没有邀功，只是顺手调整。","kind":"home","item":"一张记着口味的菜单","choices":["说一句被记得真好","也留意对方今天的需要","把这份照顾记下来，晚些时候再认真感谢"],"timing":{"min":6,"max":120},"memories":["我说被记得真好，想让这份心意有一个明确的回应。","我也留意你今天的需要，想把照顾还给日常里的你。","我把这份顺手的照顾记下来，想在不匆忙的时候认真告诉你我看见了。"]},{"id":177,"title":"树下等着未来的我们","body":"你们在常去的院子里放好一个密封小盒，记下打开的年份。对方问：到时候会不会连现在的烦恼都想不起来？","kind":"home","item":"约定年份的小盒子","choices":["写下今天最在意的事","写下希望未来记住的快乐","给未来留一个想一起回答的问题"],"timing":{"min":6,"max":120},"memories":["我写下今天最在意的事，让未来知道此刻的自己。","我写下希望以后还记得的快乐，把它留在树下。","我给未来留下一个问题，想听多年后的我们各自怎样回答。"]},{"id":178,"title":"一件外套下的两个人","body":"雨来得急，屋檐离得不远。对方举起外套问要不要一起跑过去，你们得步子一致才能不把另一边露出去。","kind":"date","item":"一起躲过的一场雨","choices":["数三声一起走","先贴近屋檐慢慢过去","先等雨小一点，不急着冲出去"],"timing":{"min":0,"max":120},"memories":["我数了三声，和你一起往前走。","我先贴近屋檐，和你慢慢走过去。","我提议先等雨小一点，和你在屋檐下留一会儿，不让同行总要赶着完成。"]},{"id":179,"title":"物件终于回到故事里","body":"你讲起一段旧旅行，对方拿出一直收着的小挂件。原来是你当时随手送的，连你自己都差点忘了。","kind":"memory","item":"一直保存的小挂件","choices":["听对方讲保存它的理由","说出自己也留着的东西","把自己已经忘掉的部分坦白说出来"],"timing":{"min":12,"max":120,"prior":169,"gap":12},"memories":["我听你讲保存它的理由，想知道这件东西怎样陪你走到今天。","我也说出自己还留着的东西，让两份记忆重新相遇。","我坦白有些细节已经忘了，请你慢慢讲，让保存的东西重新带我回去。"]},{"id":180,"title":"给两个人留空间","body":"你们画未来房间的草图。对方先替你画了工作角，你又在另一边补上对方喜欢的椅子。图上有两种笔迹。","kind":"home","item":"两种笔迹的房间图","choices":["继续一起完善","先讨论现实里能做的一处","先标出两人暂时无法确定的地方"],"timing":{"min":6,"max":120},"memories":["我和你继续完善，让两个人的空间慢慢成形。","我先讨论现实里能做到的一处，把想象往生活里挪一点。","我先标出还不能确定的地方，让未来的草图允许留下空白。"]},{"id":181,"title":"再买一次当年的东西","body":"周年那天，你们走回最早一起去过的便利店。货架换过位置，喜欢的饮料居然还在，只是包装变了。","kind":"memory","item":"两瓶熟悉的饮料","choices":["各买一瓶坐着喝","拍下新旧包装的变化","聊聊这些年口味有没有变化"],"timing":{"min":12,"max":120},"memories":["我和你各买了一瓶，坐下来慢慢喝。","我拍下新旧包装的变化，让时间有了可以对照的模样。","我问这些年口味有没有变，让熟悉的饮料也认真问过今天的我们。"]},{"id":182,"title":"分开也能赴同一个约","body":"异地时，你们约好各自去一家小店，点同样的饮料，再打视频。杯子不一样，窗外天气也不一样，碰杯的声音得自己补。","kind":"distance","item":"两地的杯子照片","choices":["隔着屏幕碰一下杯","互相介绍窗外的街景","各拍一张桌面的照片留作纪念"],"timing":{"min":6,"max":120,"needs":"distance"},"memories":["我隔着屏幕和你碰了一下杯，认真赴这个分开的约。","我和你互相介绍窗外的街景，把各自的城市借给彼此看看。","我和你各拍下桌面的一角，让隔着城市的这次赴约也能并排放在相册里。"]},{"id":183,"title":"把那片海带回家","body":"旅行回来，对方在桌上摆了两把小椅子，朝向你们拍的海景。不能每天看海的日子，也可以在这里喝杯茶。","kind":"home","item":"桌上的两把小椅子","choices":["一起布置这个角落","泡两杯茶坐一会儿","给这个角落写一张旅行小卡片"],"timing":{"min":6,"max":120,"needs":"home","prior":60,"gap":3},"memories":["我和你一起布置那个角落，让那片海在家里有位置。","我泡了两杯茶坐下来，和你在这里待一会儿。","我给这个角落写了一张旅行小卡，让带回来的海有一句我们自己的话。"]},{"id":184,"title":"第一场雪的约定","body":"天气预报终于说可能下雪。你们想起很早以前约过一起看初雪。对方发来消息：还算数吗？","kind":"date","item":"初雪的约定","choices":["约好一个方便的地方","说明时间并一起调整","先确认天气和行程，留一个备用安排"],"timing":{"min":12,"max":120,"prior":28,"gap":6},"memories":["我约了一个方便的地方，让看雪的约定能落在生活里。","我说清时间，和你一起调整，不让约定只停在想象里。","我和你先确认行程，也留个备用安排，让看雪的期待不必变成勉强。"]},{"id":185,"title":"旧播放器里的那首歌","body":"一台旧播放器修好后，第一首还是你们当年反复听的歌。对方说一直没舍得换掉里面的列表。","kind":"memory","item":"旧播放器","choices":["一起把旧列表听一遍","加一首属于现在的歌","先把旧列表备份，留住原来的顺序"],"timing":{"min":36,"max":120,"prior":39,"gap":36},"memories":["我和你把旧列表听了一遍，让从前的歌经过今天。","我加了一首属于现在的歌，让列表里的我们继续往后走。","我先备份那份旧列表，连歌的顺序也想好好留下。"]},{"id":186,"title":"工作间隙来坐一会儿","body":"对方路过你工作的地方，带来两份冰淇淋。没有特别要说的事，坐在风扇旁边吃完，再慢慢回去忙。","kind":"home","item":"两根冰淇淋木棒","choices":["陪着坐一会儿","讲一个今天的小插曲","问对方今天有没有想讲的一件事"],"timing":{"min":6,"max":120},"memories":["我陪着坐了一会儿，把工作的间隙留给相处。","我讲了今天的一个小插曲，给这段空闲添点日常。","我问你今天有没有想讲的事，不想让这一会儿总围着我的工作转。"]},{"id":187,"title":"最喜欢的是你没摆好的那张","body":"挑照片时，对方留下你笑得有点歪的一张。你说这张不够好看，对方却说这就是那天真的很开心的样子。","kind":"memory","item":"一张自然的笑脸照","choices":["把它放进相册","也选一张对方自然的样子","先留在私人相册里，不对外分享"],"timing":{"min":1,"max":120},"memories":["我把那张没摆好的照片放进相册，留下最自然的一刻。","我也选了一张你自然的样子，和自己的那张放在一起。","我愿意把那张照片留在私人相册里，让真实的快乐也有自己的边界。"]},{"id":188,"title":"我们曾经就在旁边","body":"整理旧旅行照片时，你们在背景里发现相似的身影。无法完全确认，但那天那趟车，你们居然都坐过。","kind":"memory","item":"可能擦肩的旧照片","choices":["一起核对那天的行程","给这份巧合写个小故事","把不确定的部分也写在照片旁边"],"timing":{"min":12,"max":120,"prior":36,"gap":12},"memories":["我和你核对那天的行程，找回曾经擦肩的线索。","我给这份巧合写了个小故事，让错过也有地方被记住。","我把不能确定的部分也写下来，让这份巧合保留它原来的模样。"]},{"id":189,"title":"同一首歌让两个人停下","body":"街边音箱响起一首熟悉的老歌。你正要叫对方，发现对方已经停住脚步回头找你。","kind":"date","item":"街边的一首老歌","choices":["一起站着听完","边走边轻轻哼唱","问对方这首歌让自己想起什么"],"timing":{"min":0,"max":120},"memories":["我和你站着听完了那首歌，没有急着往前走。","我边走边轻轻哼唱，把旋律带进同行的路。","我问你这首歌让你想起什么，想知道同一段旋律在两个人那里怎样响起。"]},{"id":190,"title":"一个准时的生日留言","body":"你以为这个生日只有自己记得。手机响起，是对方一段短短的语音，背景很吵，但祝福说得很认真。","kind":"distance","item":"生日语音","choices":["回一段语音说谢谢","约好有空补吃一顿饭","告诉对方哪一句祝福最打动自己"],"timing":{"min":0,"max":11},"memories":["我回了一段语音说谢谢，让准时的惦记有我的声音回应。","我约好有空补吃一顿饭，把生日再留一天给我们。","我告诉你哪一句祝福最打动我，让认真说过的话有一个具体的回应。"]},{"id":191,"title":"信里写过的远方","body":"很早以前，你们写过给未来的信。现在真的准备出发，对方把那张纸从盒里拿出来，边角已经泛黄。","kind":"memory","item":"一封写过新目的地的旧信","choices":["带着当年的心情安排这次旅程","在信的背面补上这次的目的地","把旧信收好，另写一张现在的出发清单"],"timing":{"min":60,"max":120,"prior":75,"gap":48},"memories":["我带着当年写信时的心情安排这次旅程。未来终于到了眼前，也有了今天的我们。","我在信的背面补上这次的目的地，让从前留下的纸接着记录现在。","我收好旧信，另写今天的出发清单，让从前的期待和现在的生活都被认真保存。"]},{"id":192,"title":"帮你捡起散落的纸","body":"一阵风把你的纸吹散。旁边的人帮忙捡回来，还按页码排好了。递到你手里时，指尖沾着一点地上的水。","kind":"encounter","item":"被风吹皱的一页纸","choices":["递纸巾并认真道谢","请对方喝杯附近的热饮","先把纸收稳，邀请对方留个联系方式"],"timing":{"min":0,"max":0.1,"start":"new"},"memories":["我递了纸巾，认真道谢，记住这次伸手相助。","我请你喝杯附近的热饮，让感谢多停留一会儿。","我先把纸收好，再问能不能留下联系方式，想让这次伸手相助有机会接到以后。"]},{"id":193,"title":"原来你也一直在找我","body":"一条消息没发出去，你以为对方没有回复。重新连上网络，几条关心同时跳出来，时间正是你犹豫着要不要再问的时候。","kind":"repair","item":"迟到的几条消息","choices":["解释刚才的状况","直接打电话把误会说开","先报平安，再约时间把误会讲清"],"timing":{"min":0,"max":120},"memories":["我解释刚才的状况，不再让寻找彼此变成猜测。","我直接打电话把误会说开，想让你听见我的声音。","我先报了平安，再约时间讲清误会，让等待先有一个不必再担心的回应。"]},{"id":194,"title":"费了心找到的小谱子","body":"你提过找不到一份练习资料。对方记在心里，后来在旧书摊找到，拿来时还特意夹了一张容易翻到的书签。","kind":"dream","item":"夹着书签的小谱子","choices":["一起试试上面的片段","告诉对方这份心意很重要","请对方一起看看找到它的那一页"],"timing":{"min":6,"max":120},"memories":["我和你试了试谱子上的片段，让找来的心意有了声音。","我告诉你这份心意很重要，不让费过的心默默过去。","我请你一起翻开那一页，想和你分享终于找到它的心情。"]},{"id":195,"title":"终于有了同框的照片","body":"过去总是一个人拍另一个人。今天你们请路人帮忙，第一次认真站到同一张照片里，拍完还一起追着道谢。","kind":"journey","item":"第一张认真同框照","choices":["选一张洗出来","留一张没准备好的花絮","各挑一张喜欢的，保留两种眼光"],"timing":{"min":1,"max":11},"memories":["我选了一张洗出来，想把同框的我们握在手里。","我留了一张没准备好的花絮，让照片记住自然的一刻。","我和你各挑一张喜欢的照片，让同框的我们也保留两种眼光。"]},{"id":196,"title":"一起学到灯亮","body":"你们各有想学的东西，约好坐在同一张桌旁。天黑了才发现谁都忘了开灯，对方伸手开灯，又把水杯往你这边推。","kind":"dream","item":"并肩学习的夜晚","choices":["再学一小段就休息","一起出去吃点东西","约好各自完成一个小目标再交流"],"timing":{"min":6,"max":120},"memories":["我再学了一小段才休息，把今天的进步留在这里。","我和你出去吃点东西，让练习之后有一顿共同的饭。","我和你约好各自做完一个小目标，再分享进展，让陪伴也留出专心的空间。"]},{"id":197,"title":"年轻时的约定终于成行","body":"好多年前说要一起看的演出，终于有合适时间。对方把两张票放到桌上，说这次不用再说以后了。","kind":"journey","item":"迟来多年的演出票","choices":["认真空出这一天","一起翻出当年聊过的消息","确认双方的时间，把出发前的事一起安排好"],"timing":{"min":60,"max":120},"memories":["我认真空出这一天，终于把年轻时的约定放进现在。","我和你翻出当年聊过的消息，重读出发以前的我们。","我和你确认时间，把出发前的事安排好，让终于成行不只停在两张票上。"]},{"id":198,"title":"把需要的那一份递给你","body":"临时活动里你忘带资料，对方把自己的推过来，说可以一起看。结束后，你把补好的笔记发回去，标出容易漏的一行。","kind":"encounter","item":"两人一起看的资料","choices":["一起把剩下的做完","活动后请对方喝点东西","把整理好的笔记分享给对方"],"timing":{"min":0,"max":0.1,"start":"new"},"memories":["我和你把剩下的事情做完，让分担一直到最后。","活动以后，我请你喝点东西，想好好道一声谢。","我把整理好的笔记分享给你，让被借来的帮助也有新的用处。"]},{"id":199,"title":"跨城电话里的普通一天","body":"住在不同城市后，你们常在晚上通话。今天话不多，对方那边传来洗杯子的声音，你这边是收衣架碰在一起的声音。","kind":"distance","item":"一通有生活声音的电话","choices":["聊聊明天的小计划","开着电话各做各的事","各说今天最需要被理解的一件事"],"timing":{"min":6,"max":120,"needs":"distance"},"memories":["我聊起明天的小计划，让电话里的日常向前延伸一点。","我开着电话和你各做各的事，让普通的一天也有陪伴。","我和你各说一件今天最需要被理解的事，让普通的电话也能接住一点难处。"]},{"id":200,"title":"住在一起，还是各自留一盏灯","body":"相处已有一阵，谈起下半年的安排，对方问：要不要试着住在一起？也可以继续各自住，见面的时候把时间留完整。两种日子，都可以认真过。","choices":["试着一起住，先商量各自的空间","继续各自住，约好相聚的时间","先各自住，固定每周一起做一顿饭"],"memories":["我愿意试着一起住，也先说清彼此需要的空间。我们把共同生活当作一次可以商量的尝试。","我想保留各自的住处，和你约好认真相聚的时间。靠近也可以给两个人留着自己的灯。","我想先各自住，约你每周认真做一顿饭，让共同生活从能兑现的一小段开始。"],"timing":{"min":6,"max":24},"kind":"dream","item":"一次生活方式的商量","decision":"home","replies":["对方愿意一起尝试，也提出先约好各自独处的时间。共同生活从一场具体的商量开始。","对方接受了这个安排，与你约好下次见面的时间。你们保留各自的住处，也认真保留相聚。","对方愿意每周认真留一顿饭的时间，也和你约好轮流安排。你们仍各自住，让靠近先从能持续的小事开始。"]},{"id":201,"title":"一个需要一起商量的机会","body":"对方得到一个需要去外地工作的机会，还没有答复。消息放在桌上，对方问：我们愿不愿意试试这段距离？如果不合适，也可以等下一次。","choices":["支持成行，一起约好联系的方式","说出顾虑，请对方再考虑本地的机会","商量一起去新城市，各自安排工作与住处"],"memories":["我支持你去试试那个机会，和你约好联系的方式。想念还没开始，我们先把怎样相处说清楚。","我说出对距离的顾虑，请你再看看本地的机会。未来需要把两个人的生活都考虑进去。","我想和你商量一起去新的城市，也给各自的工作和住处留出位置。"],"timing":{"min":12,"max":36},"kind":"dream","item":"一份还没答复的邀请","decision":"distance","replies":["对方决定接受这次外地工作的机会，和你一起定好联系的时间。接下来的日子，你们会试着隔着距离相处。","对方听完你的顾虑，决定暂缓外地的邀请，先看看本地的机会。你们把这次决定认真说清楚。","对方愿意和你一起去新城市，也提出各自确认工作和住处再落实。你们把同行当成两个人都要参与的决定。"]},{"id":202,"title":"杯子上的小字","body":"第一次替你点饮品，对方拿着笔问甜度，迟迟没有勾选。你发现，这些很小的偏好，原来也需要慢慢认识。","choices":["告诉对方自己惯常的口味","说今天想试一个新口味","请对方推荐一款，再说自己的感受"],"memories":["我告诉你自己惯常的口味，让杯子上的小字成为认识我的一个开头。","我说今天想试个新口味，把这次见面留给一点未知。","我请你推荐一款，也认真说出尝过的感受，让认识从一次来回开始。"],"timing":{"min":0.03,"max":5},"kind":"date","item":"饮品的第一页","motif":"饮品","chapter":0},{"id":203,"title":"你记住了，也还会问","body":"你还记得我当时说的口味，点单前却又问了一遍：今天也一样吗？","choices":["沿用上次的口味","告诉对方最近的偏好变了","请对方介绍自己今天想喝的口味"],"memories":["我仍要上次的口味。你记得，而我也愿意再说一遍。","我告诉你最近的偏好变了。被记住很好，有变化时能重新开口，也很好。","我先听听你今天想喝什么，不让被记住的总是我一个人的喜欢。"],"timing":{"min":6,"max":23,"prior":202,"gap":3},"kind":"date","item":"饮品的第2页","motif":"饮品","chapter":1,"branches":["你还记得我当时说的口味，点单前却又问了一遍：今天也一样吗？","你记得我上次想试新口味，便把菜单递来：今天还想换一种吗？","上次我请你推荐饮品，今天你把菜单递过来，说想听听那一杯合不合我的口味。"]},{"id":204,"title":"熟悉也留一个空格","body":"常去的小店换了菜单，你没有替我勾选，只指了指过去常点的那一栏。","choices":["说清今天想喝什么","邀请对方各选一杯交换尝尝","问店员有什么新的，和对方一起挑"],"memories":["我说清今天想喝什么。相处久了，我们也没有省去这句询问。","我邀你各选一杯交换尝尝。熟悉的日子里，还留着一点新味道。","我和你一起问了今天的新口味，让熟悉的小店也有重新发现的可能。"],"timing":{"min":24,"max":59,"prior":203,"gap":12},"kind":"date","item":"饮品的第3页","motif":"饮品","chapter":2,"branches":["常去的小店换了菜单，你没有替我勾选，只指了指过去常点的那一栏。","小店换了菜单，你说起我之前换过口味的事，把选择留给今天的我。","小店换了菜单，你想起上次我先问了你的喜欢，这回把两个人想尝的口味都圈了出来。"]},{"id":205,"title":"很多杯之后","body":"又来到柜台前，你仍旧先问我今天想喝什么。那个很早就会问的问题，留到了现在。","choices":["照今天的心情重新点单","说起最早那次点单的笨拙","替彼此推荐一杯，再由自己决定"],"memories":["我照今天的心情重新点单。这么多年，你记得我的喜欢，也给现在的我留着回答的位置。","我说起最早那次迟迟没勾下去的笔。许多杯饮品过去，认认真真问我的那个人还在。","我和你互相推荐，也把最后的决定留给各自。熟悉是一份参考，不是代替。"],"timing":{"min":60,"max":120,"prior":204,"gap":24},"kind":"memory","item":"饮品的第4页","motif":"饮品","chapter":3,"branches":["又来到柜台前，你仍旧先问我今天想喝什么。那个很早就会问的问题，留到了现在。","又来到柜台前，我们说起那次交换着尝的饮品。你问今天要不要再各选一杯。","又来到柜台前，你提起我们曾一起问过的新口味，问今天还想不想找一点新的。"]},{"id":206,"title":"两个人的步速","body":"并肩走了一段，你总比对方快半步。到了路口，对方停下来问：我们是不是走得太急了？","choices":["放慢脚步，走到对方身边","告诉对方自己今天有些赶时间","问对方舒服的步速，约一个会合点"],"memories":["我放慢脚步，走到你身边，第一次认真留意两个人不同的步速。","我告诉你今天有些赶时间，不让快起来的脚步变成一个难猜的表情。","我问清你舒服的步速，约好前面会合，让同行也可以容下不同的节奏。"],"timing":{"min":0.03,"max":5},"kind":"date","item":"走路的第一页","motif":"走路","chapter":0},{"id":207,"title":"走慢以前先问一句","body":"散步到路口，你想起我曾放慢脚步，问我今天是不是也不着急。","choices":["一起绕一段小路","说今天累了，坐一会儿","各走一小段，再在约好的地方碰面"],"memories":["我和你绕了一段小路，把有空的这一晚慢慢走完。","我说今天累了，想先坐一会儿。熟悉以后，我开始能把自己的步速说清楚。","我约你各走一小段，在前面碰面，让散步也有一点各自的安静。"],"timing":{"min":6,"max":23,"prior":206,"gap":3},"kind":"date","item":"走路的第2页","motif":"走路","chapter":1,"branches":["散步到路口，你想起我曾放慢脚步，问我今天是不是也不着急。","散步到路口，你先问我今天是不是还赶时间，不再只凭步子猜。","再次走到路口，你想起我们约过会合点，先问今天想并肩走，还是各留一点自己的步速。"]},{"id":208,"title":"同一段路，两种体力","body":"那条绕过的小路还在。今天你说走得有点累，问能不能缩短一点。","choices":["陪对方坐下来休息","商量改走更短的路","先问清哪里不舒服，再决定继续还是返回"],"memories":["这次我陪你坐下来。曾经有人等我的地方，也可以换我等等你。","我和你商量走短一点的路。一起走了这些年，我们学会把两个人的体力都算进去。","我先问清你的不适，和你决定继续还是返回，不用走完来证明陪伴。"],"timing":{"min":24,"max":59,"prior":207,"gap":12},"kind":"date","item":"走路的第3页","motif":"走路","chapter":2,"branches":["那条绕过的小路还在。今天你说走得有点累，问能不能缩短一点。","再次经过那个路口，今天换成你想坐一会儿。我们都记得上次谁先说累。","那次各走一小段再碰面的路还在。今天你说走得有些累，问这次能不能换一种安排。"]},{"id":209,"title":"不必每一次都走完","body":"又到那个能坐下歇脚的地方，你先看看我，问今天想走多远。","choices":["留在近处慢慢走","说今天想走远一点","让对方选今天的路线，我来安排休息"],"memories":["我想留在近处慢慢走。好多年了，我们依然可以只走今天愿意走的那一段。","我说今天想走远一点。默契不是永远走同一条路，是这次也能重新商量。","我请你选路线，自己来留意休息，让走到哪里都有人照顾彼此的步子。"],"timing":{"min":60,"max":120,"prior":208,"gap":24},"kind":"memory","item":"走路的第4页","motif":"走路","chapter":3,"branches":["又到那个能坐下歇脚的地方，你先看看我，问今天想走多远。","再次走到岔路口，你提起那次改走短路的晚上，问今天想怎么走。","又到岔路口，你提起上次我先问了哪里不舒服。这回你也先问我的状态，再商量往哪边走。"]},{"id":210,"title":"一张可以留下的纸","body":"你们各写下一件今天觉得不错的小事，纸条并排放在桌上。对方问，这些小纸片要不要留下？","choices":["把两张纸条一起收好","读给对方听，只留下这一刻","给今天录一小段声音"],"memories":["我把两张纸条一起收好。那时还不知道，普通的一天也可以有自己的档案。","我把纸上的小事读给你听，没有收起纸片，只想好好记住这一刻。","我给今天录下一小段声音，让值得留下的日常也可以被听见。"],"timing":{"min":0.03,"max":5},"kind":"date","item":"便条的第一页","motif":"便条","chapter":0},{"id":211,"title":"记事的方法也可以不同","body":"你拿来一个空信封，问我上次收好的两张纸要不要放进去。","choices":["再写一张今天的小事","当面讲一件最近的事","为今天挑一张照片，写一句说明"],"memories":["我又写下一张今天的小事，让日常多一个能被翻到的地方。","我当面讲起最近的一件事，让记忆先留在我们的交谈里。","我替今天挑一张照片，写下一句说明，给回忆换一种可以翻看的样子。"],"timing":{"min":6,"max":23,"prior":210,"gap":3},"kind":"date","item":"便条的第2页","motif":"便条","chapter":1,"branches":["你拿来一个空信封，问我上次收好的两张纸要不要放进去。","你记得我上次只把小事读出来，今天又问：有没有一件愿意说给我听的事？","你记得我给那天录过一小段声音，今天问要不要再用一种喜欢的方式留下日常。"]},{"id":212,"title":"没有大事的一页","body":"今天没发生什么特别的，你把一张空白纸推来，说这样的一天也可以记。","choices":["记下一个容易被忘掉的细节","问对方今天想留下什么","留一页空白，写上今天的日期"],"memories":["我记下一个容易被忘掉的细节。相处久了，写下来的东西反而越来越小。","我问你今天想留下什么，让这段记事里也有你的眼睛。","我留下一页空白，只写日期。平常的一天也可以不必勉强写成故事。"],"timing":{"min":24,"max":59,"prior":211,"gap":12},"kind":"date","item":"便条的第3页","motif":"便条","chapter":2,"branches":["今天没发生什么特别的，你把一张空白纸推来，说这样的一天也可以记。","今天没有特别的话题，你还是问起我最近怎么样，给普通的一天留出听的时间。","翻到之前那张配着说明的照片，你说今天没什么特别，也可以留下空白，或者只写很小的一件事。"]},{"id":213,"title":"留给今天的空白","body":"说起这些年记过的小事，你递来一张新纸。过去已经很多，今天仍然空着。","choices":["记录此刻两个人坐在一起","请对方先讲今天的小事","各选一件旧事，再说说现在怎么看"],"memories":["我记下此刻两个人坐在一起。许多年以后，值得留下的仍然可以是这么小的一件事。","我请你先讲今天的小事。听了这么多年，我仍想知道你怎样过这一天。","我和你各选一件旧事，说说现在怎样看，让回忆也容得下后来不同的心情。"],"timing":{"min":60,"max":120,"prior":212,"gap":24},"kind":"memory","item":"便条的第4页","motif":"便条","chapter":3,"branches":["说起这些年记过的小事，你递来一张新纸。过去已经很多，今天仍然空着。","说起那些轮流讲过的日常，你问今天是不是也有一件想留住的小事。","说起那页只写了日期的空白，你问我现在怎样看那个普通的日子。过去不必被填满，今天也可以重新记录。"]},{"id":214,"title":"还没学会站得自然","body":"请人拍合照时，你们都站得很直，不知道手该往哪里放。拍完，对方把屏幕转过来，请你一起挑。","choices":["留下那张拘谨的合照","再拍一张自然些的","各拍一张眼里的对方，暂不拍合照"],"memories":["我留下那张拘谨的合照，把还不会自然站在一起的我们也收好。","我和你又拍了一张，慢慢找两个人都舒服的姿势。","我和你各自拍下眼里的对方，先从注视彼此学起，不急着站成同一个姿势。"],"timing":{"min":0.03,"max":5},"kind":"date","item":"相片的第一页","motif":"相片","chapter":0},{"id":215,"title":"相册里多了一点日常","body":"你提起最初那张拘谨的合照，说最近也想拍一点平常的样子。","choices":["同意拍下一张没准备好的自己","说还是想先整理一下","先拍共同待过的地方，今天不拍人"],"memories":["我愿意留下没准备好的自己，让相册里有一点平常的样子。","我说还是想先整理一下。被你熟悉，并不意味着每一张照片都不用征求我的意思。","我想先拍下共同待过的地方，让相册里也有两个人没有入镜的日子。"],"timing":{"min":6,"max":23,"prior":214,"gap":3},"kind":"date","item":"相片的第2页","motif":"相片","chapter":1,"branches":["你提起最初那张拘谨的合照，说最近也想拍一点平常的样子。","你提起最初重拍的合照，说最近不必每次都站好再按快门。","你提起最初各自拍下的那张对方，问最近要不要也记录一些共同的日常，不必每次都站到同一张照片里。"]},{"id":216,"title":"快门前仍然问一句","body":"你举起相机，又先问我今天愿不愿意入镜。熟悉没有替我作答。","choices":["自然地站进镜头","这次换我给对方拍","先把相机放下，好好过完这一刻"],"memories":["我自然地站进镜头。比最初放松了许多，也仍然被认真问过。","这次我拿起相机，替你留下此刻的样子。记录我们，也可以轮流。","我请你先放下相机，想和你完整地待在此刻，不急着把它变成照片。"],"timing":{"min":24,"max":59,"prior":215,"gap":12},"kind":"date","item":"相片的第3页","motif":"相片","chapter":2,"branches":["你举起相机，又先问我今天愿不愿意入镜。熟悉没有替我作答。","你记得我上次想整理好再拍，这次也留出时间，等我说可以。","你记得我上次只想拍共同待过的地方，这次举起相机前，先问今天想不想入镜。"]},{"id":217,"title":"照片外面的人","body":"你说起最早那次合照，再次举起相机，问要不要留一张今天。","choices":["请人拍一张现在的我们","先聊聊当时拍照的紧张","拍下此刻的风景，把两人的话写在背面"],"memories":["我请人拍下现在的我们。姿势已经不再拘谨，但按下快门前，我们仍会看一眼彼此。","我说起最早拍照时不知道手往哪里放。原来走过的时间，也藏在后来不必练习的动作里。","我拍下风景，把两个人的话留在背面，让没有入镜的我们也在这张照片里。"],"timing":{"min":60,"max":120,"prior":216,"gap":24},"kind":"memory","item":"相片的第4页","motif":"相片","chapter":3,"branches":["你说起最早那次合照，再次举起相机，问要不要留一张今天。","你把相机递过来，说这次想让两个人都在画面里。","你提起上次我们放下相机好好待着的那一刻，问今天想留下照片，还是仍然只记在心里。"]},{"id":218,"title":"一句话没接好","body":"聊到周末怎么安排，你们第一次明显意见不同。对方停住话头，问要不要各自把想法说完。","choices":["现在慢慢把想法说清楚","说想缓一缓，约好晚点再谈","先复述彼此的想法，确认没有听错"],"memories":["我把自己的想法慢慢说清楚，试着让不同也能留在一次交谈里。","我说想缓一缓，也约好晚点再谈，不把暂时的安静变成没有下文。","我先和你复述彼此的想法，想在谈怎么做以前，确认我们听见的是同一件事。"],"timing":{"min":0.03,"max":5},"kind":"date","item":"分歧的第一页","motif":"分歧","chapter":0},{"id":219,"title":"记得上次怎样说话","body":"又有一件事意见不同，你先问：像上次那样，我们各自说完好吗？","choices":["把这一次的具体顾虑讲出来","先请对方把想法讲完","各列一个最在意的点，再寻找共同部分"],"memories":["我讲出这一次具体的顾虑，没有拿从前的分歧替今天作答。","我先请你把想法讲完。相处久一点，我也慢慢学着不急于接话。","我和你各列一个最在意的点，从真实的需要里寻找能一起做的部分。"],"timing":{"min":6,"max":23,"prior":218,"gap":3},"kind":"date","item":"分歧的第2页","motif":"分歧","chapter":1,"branches":["又有一件事意见不同，你先问：像上次那样，我们各自说完好吗？","又有一件事意见不同，你问我是不是还想先缓一缓，也说自己愿意等到约好的时间。","又有一件事意见不同，你想起我们曾先复述彼此的意思，问这次要不要也先确认有没有听错。"]},{"id":220,"title":"不替熟悉的人猜答案","body":"讨论一个新安排时，你没有说我总是这样，只问这次最担心什么。","choices":["承认自己的想法与从前不同了","说出仍然在意的那一件事","坦白现在还不确定，先试一个小安排"],"memories":["我承认自己的想法变了。以前谈好的答案，也可以重新打开。","我说出自己仍在意的那件事，希望熟悉不会让重要的话被略过。","我承认自己现在还不确定，想先试一个小安排，再从生活里寻找答案。"],"timing":{"min":24,"max":59,"prior":219,"gap":12},"kind":"date","item":"分歧的第3页","motif":"分歧","chapter":2,"branches":["讨论一个新安排时，你没有说我总是这样，只问这次最担心什么。","讨论一个新安排时，你先说了自己的想法，也留出时间听我讲。","商量新的安排时，你记得我们曾各说出最在意的点，这次也没有急着替我猜答案。"]},{"id":221,"title":"多年以后还可以重谈","body":"又一次商量未来，你提起我们曾经改过的想法，说今天也不用照旧。","choices":["一起重新写下现在的打算","先留一晚，明天继续商量","把暂时谈不拢的部分留白，先落实能做的"],"memories":["我和你重新写下现在的打算。多年后的默契，是知道旧答案也可以重新讨论。","我想先留一晚，明天接着谈。走到现在，我们依然不必在同一刻想明白所有事。","我和你给暂时谈不拢的地方留白，先把能够一起做的部分落下来。"],"timing":{"min":60,"max":120,"prior":220,"gap":24},"kind":"memory","item":"分歧的第4页","motif":"分歧","chapter":3,"branches":["又一次商量未来，你提起我们曾经改过的想法，说今天也不用照旧。","又一次商量未来，你先问起那件我一直在意的事，想知道现在有没有变化。","又一次商量未来，你提起我们曾先试一个小安排再看感受，说今天也可以从还没确定的地方慢慢开始。"]},{"id":222,"title":"地图上先留一小格","body":"你们翻看旅行地图，对方问：如果以后能一起出门，你更想仔细安排，还是留一点临时改变的余地？","choices":["先说一个具体想去的地方","说想留一点随路改变的余地","先选一段附近的路，试试两人的旅行节奏"],"memories":["我说起一个具体想去的地方，第一次把两个人的远方讲得清楚一点。","我想留一点随路改变的余地，让未来的旅程不必此刻就填满。","我想先和你走一段附近的路，慢慢认识两个人一起出发的节奏。"],"timing":{"min":0.03,"max":5},"kind":"date","item":"旅行的第一页","motif":"旅行","chapter":0},{"id":223,"title":"愿望落到日历上","body":"你记得我说过想去的地方，这次拿出日历问哪段时间可以先留空。","choices":["一起留出一段可以出发的时间","说今年先安排一次短途","先各列一项出发前需要解决的事"],"memories":["我和你留出一段时间，让地图上的念头走进日历。","我说今年先从短途开始，让想一起走的心意先落在能够做到的日子里。","我和你各列一件出发前要解决的事，让想去的远方有现实里可以迈出的第一步。"],"timing":{"min":6,"max":23,"prior":222,"gap":3},"kind":"date","item":"旅行的第2页","motif":"旅行","chapter":1,"branches":["你记得我说过想去的地方，这次拿出日历问哪段时间可以先留空。","你记得我喜欢留余地，这次拿出日历，说可以先定出发的时间，路上慢慢决定。","你记得我说过先走一段附近的路，这次拿出日历，问什么时候可以认真空出一天。"]},{"id":224,"title":"出发也要顾今天的我们","body":"再次安排出门，你先问起我的工作和体力，说不必照搬上次的计划。","choices":["少排几个地方，留时间休息","挑一个两个人都惦记的地方","先商量预算和各自的期待，再排路线"],"memories":["我少排了几个地方，给休息留出时间。旅程里也要装得下此刻的我们。","我和你挑了一个都惦记的地方，让这次出发回应两个人的愿望。","我先和你商量预算与期待，让这一次的路线真正容得下两个人。"],"timing":{"min":24,"max":59,"prior":223,"gap":12},"kind":"date","item":"旅行的第3页","motif":"旅行","chapter":2,"branches":["再次安排出门，你先问起我的工作和体力，说不必照搬上次的计划。","再次安排出门，你说起我们曾从短途开始，问这次想多走一点还是仍旧慢慢来。","再次安排出门，你提起上次各列的一件准备事项，问今天还有哪些事需要先处理。"]},{"id":225,"title":"这一回，可以出发了","body":"又一次把地图铺开，你先留出休息的空白，再问我这回想看哪里。","choices":["把这次出发认真定下来","留一段不赶时间的路","先把眼前责任安排好，再留出完整的假期"],"memories":["我认真定下这次出发。走过这么多日子，地图上终于要留下两个人的脚步。","我想留一段不赶时间的路。我们终将会一起旅行，也想把同行的日子过得从容。","我和你先安排好眼前的责任，认真腾出假期，让出发可以少一点牵挂。"],"timing":{"min":60,"max":120,"prior":224,"gap":24},"kind":"memory","item":"旅行的第4页","motif":"旅行","chapter":3,"branches":["又一次把地图铺开，你先留出休息的空白，再问我这回想看哪里。","又一次把地图铺开，你指着我们都惦记的那一页，问这一回要不要成行。","又一次把地图铺开，你先问起我们这次的预算和期待，想让这段路仍然容得下两个人。"]},{"id":226,"title":"两个人之外的第一张饭桌","body":"家人问起能不能一起吃顿饭。你盯着消息看了很久，对方没有催，只问：你想让我怎样陪你？见面也好，暂时不见也好，我们先商量。","choices":["愿意慢慢认识彼此的家人","暂时保留距离，先把两人的生活过稳","先从一次视频见面开始"],"memories":["我愿意慢慢认识你的家人，也让你走近我的。两个人的世界，开始多出一些需要认真对待的名字。","我说想暂时保留和家人的距离。愿意继续走下去，也包括把暂时做不到的事如实告诉你。","我想先从一次视频见面开始，让彼此的家人慢慢进入我们的生活。"],"replies":["对方和你先约了一顿不赶时间的饭，也说不必在一次见面里证明什么。","对方答应不催你赴约，也会亲自向家人解释，不让你独自承担那个拒绝。","对方和家人约了一次不太长的视频，也会陪你一起打招呼。你们先认识彼此，不急着把一次通话变成更多要求。"],"kind":"repair","item":"两个人之外的第一张饭桌","timing":{"min":9,"max":24},"family":true,"decision":"family_contact"},{"id":227,"title":"两边都亮着的灯","body":"节日前，两边家人都问你们哪天回去。你算着路程，发现假期会全耗在往返上。对方把日历转过来：我们不能每次都用累坏自己来表示在乎。","choices":["这次分开探望，各自照顾家人","一起轮流探望，把另一次相聚提前约好","这次留在自己的城市，另约时间探望"],"memories":["这个节日，我们分别去陪家人，也认真留出属于两个人的时间。没有坐在同一张饭桌旁，不等于没有站在一起。","我和你重新排了探望的日子。心里装着两边的灯，也给两个人的休息留了一格。","我和你决定这次先留在自己的城市，也认真另约探望的时间，让休息不必总排在最后。"],"replies":["对方主动打电话说明安排，没有把分开探望说成你的要求。临走前，你们约好返程后一起吃饭。","对方负责和自己家人解释调整，也提醒你不必一遍遍道歉。那张日历终于空出了一天。","对方和你一起说明这次不赶路，也落实了另一次探望的时间。你们没有把留下休息的决定推给某一个人。"],"kind":"repair","item":"两边都亮着的灯","timing":{"min":12,"max":36},"family":true,"requires":{"contact":true}},{"id":228,"title":"那句不太舒服的关心","body":"家人又通过对方问起你的安排，语气里有一句让你不舒服的话。对方把手机放下，说自己刚才没接好这句话，想听听你希望怎样处理。","choices":["请对方亲自说明两人的边界","先说清受伤的地方，再一起决定怎么回应","请对方先听完我的感受，不急着替谁解释"],"memories":["我请你亲自说明我们的边界。有些难听的话，我不想再一个人消化。","我说清那句话为什么让我难过，和你一起决定怎样回应。我们没有把沉默当成懂事。","我请你先听完我的感受，不急着替任何人解释，让委屈先有地方被看见。"],"replies":["对方给家人回了电话，说明决定是两个人一起做的。电话以后，你们仍有些疲惫，但不用由你单独解释了。","对方先听你讲完，承认自己当时应该出声。回应的话还要斟酌，你们先约定下次不再让一个人独自面对。","对方停下解释，先听你把感受说完，再问你希望下一步怎么回应。那句话仍然令人难受，但你不必再独自消化。"],"kind":"repair","item":"那句不太舒服的关心","timing":{"min":18,"max":60},"family":true},{"id":229,"title":"那张纸之外的承诺","body":"谈起往后的生活，对方问你怎么看婚姻，也说自己在意的是遇到事情能不能一起承担。桌上没有准备好的答案，只有两个人各自带来的期待。","choices":["愿意进入婚姻，先谈清责任与安排","暂不结婚，仍认真约定共同的生活","先办一次小小的承诺仪式，暂不登记"],"memories":["我愿意和你进入婚姻，也把住处、家人和各自的需要一项项摊开。承诺从具体的商量开始。","我说暂不结婚，却愿意认真经营共同的生活。我们把怎样承担写清楚，没有让关系只剩一个称呼。","我想先和你办一次小小的承诺仪式，暂不登记，也认真谈清我们愿意怎样承担。"],"replies":["对方也愿意，和你约好先商量家务、工作与家庭边界，再安排登记和庆祝。","对方接受这个选择，也提出把重要安排定期拿出来再谈。两个人都不靠含糊来维持靠近。","对方愿意一起安排一个小小的仪式，也确认暂不登记。你们把责任和边界认真谈清，没有让仪式替未来作完所有决定。"],"kind":"repair","item":"那张纸之外的承诺","timing":{"min":18,"max":36},"family":true,"decision":"commitment"},{"id":230,"title":"庆祝的规模，生活的重量","body":"开始安排结婚的庆祝，家人的想法比你们原来预计的多。看着越写越长的清单，你想到之后的生活，对方也一直没有合上账本。","choices":["把庆祝缩小，留出两个人的余裕","保留重视的仪式，一起删掉不必要的项目","先暂停筹备，重新确认两人真正想要什么"],"memories":["我和你把庆祝缩小，把余裕留给接下来真实的日子。重要的人知道，彼此也知道，就很好。","我和你留下真正重视的仪式，也一起删去不属于我们的要求。承诺没有因此变轻，生活却能少一点负担。","我和你先暂停筹备，重新确认真正想要的庆祝，不让越写越长的清单替我们决定。"],"replies":["对方主动和家人解释规模的调整。仍有人不太理解，你们没有互相推诿，而是一起重复同一个决定。","对方把自己最在意的部分也说出来。清单改了几次，最后留下的是两个人都愿意承担的安排。","对方和你暂停了新增安排，各自写下真正重视的部分，再约时间一起看。已经花过的心思没有变成必须继续的理由。"],"kind":"repair","item":"庆祝的规模，生活的重量","timing":{"min":24,"max":48},"family":true,"requires":{"marriage":true}},{"id":231,"title":"未来要不要多一个人","body":"聊到孩子时，你们第一次没有用玩笑带过。对方说有期待，也怕照顾不过来；你想到自己的工作、自由和责任。这个问题，需要两个人都愿意。","choices":["愿意养育孩子，先认真做准备","现在还没准备好，几年后再谈","更想过两个人的生活，不安排育儿"],"memories":["我愿意和你养育一个孩子，也想先把照护、工作和支持都商量清楚。喜欢一个未来，还要学着承担它。","我坦白现在没有准备好，和你约好几年后再认真聊。我们没有用急着答应来证明相爱。","我说自己更向往两个人的生活。愿意陪你走下去，也想让共同的未来容得下这个真实的愿望。"],"replies":["对方也愿意准备，但提出先落实住处和分担，不能默认照护会落在某一个人身上。","对方说自己也有担心，接受先不推进。你们约好以后再谈，眼下先把生活过稳。","对方认真想了想，说也愿意选择没有孩子的生活。你们决定共同面对外面的追问，不把答案推给一个人。"],"kind":"repair","item":"未来要不要多一个人","timing":{"min":24,"max":48},"family":true,"decision":"child_intent"},{"id":232,"title":"谁的时间会被改变","body":"真正列出养育的安排，才发现接送、夜间照料和工作调整都需要人。你们还要处理住处与距离。对方划掉一句“到时候再说”：这些现在就该讲清楚。","choices":["一起调整住处与工作，明确轮流照护","承认条件还不够，先暂停准备","先试着执行照护分工，再决定是否继续准备"],"memories":["我和你一起调整住处与工作，把轮流照护写得具体。那个未来不再只是一句想要，也要有两个人腾出的时间。","我承认现在的条件还不够，想先暂停准备。认真对待一个孩子，也包括不把尚未解决的问题藏起来。","我想先试着执行商量过的分工，再决定是否继续准备，不把纸上的安排当成已经具备的条件。"],"replies":["对方主动接下一部分工作调整，和你落实同城的住处与轮班安排。你们决定在这些准备落定后再迎接孩子。","对方同意暂停，把尚未解决的事情单独记下。你们继续过眼前的日子，没有把暂停说成谁让谁失望。","对方愿意先试着执行分工，和你约好记录现实中的难处。你们暂不继续迎接孩子的准备，等条件更清楚再谈。"],"kind":"repair","item":"谁的时间会被改变","timing":{"min":30,"max":72},"family":true,"requires":{"intent":"ready","prepared":false},"familyEffect":"preparation"},{"id":233,"title":"那个问题，可以有新的答案","body":"距离上次谈孩子已经过了两年。对方没有把日历上的约定当成催促，只问：现在的我们，和当时有没有不一样？你们仍可以继续说不确定。","choices":["这次愿意一起准备","仍未准备好，继续保留现在的生活","确认不走育儿这条路"],"memories":["我重新看了看现在的生活，愿意和你一起做准备。这个回答来自今天的我们，不是为了兑现谁的催促。","我说自己仍未准备好。我们把不确定留下，没有让一个到期的日期替两个人做决定。","我确认自己不想走育儿这条路，和你一起把没有孩子的未来说得更具体。"],"replies":["对方也想试着准备，提出仍要先谈清照护和工作的安排。以前的讨论没有被跳过。","对方接受这个答案，不再设一个必须改变想法的期限。你们决定先珍惜现在的生活。","对方说愿意和你继续这条路，也会共同回应家人的期待。未来仍然有很多可以一起做的事。"],"kind":"repair","item":"那个问题，可以有新的答案","timing":{"min":48,"max":84},"family":true,"requires":{"intent":"later"},"afterFlag":"intentAt","afterMonths":24,"familyEffect":"revisit"},{"id":234,"title":"生活里第一次多出的呼吸","body":"从认真准备到这一刻，已经又过了一年。孩子终于进入你们的生活，房间里多了很轻的呼吸声。排好的照护表还贴在墙上，对方看着你，问今晚先怎么轮换。","choices":["按约轮换，我先休息一段","我先照看，请对方把下一班接好","今晚分工照看与收尾，明天再轮换"],"memories":["孩子进入生活的第一晚，我按约先去休息，把这一班放心交给你。成为父母，也从愿意让彼此睡一会儿开始。","孩子进入生活的第一晚，我先照看，请你把下一班接好。我们没有只说辛苦，而是开始兑现轮换的约定。","孩子进入生活的第一晚，我和你分开照看与收尾，约好明天轮换，让两种忙碌都被看见。"],"replies":["对方接下这一班，把你叫醒的时间写清楚，也说遇到拿不准的事会一起商量。","对方确认好接班时间，把自己需要的东西备在旁边。那份曾经讨论过的分担，终于落进今晚。","对方和你分清照看与收尾的事情，也约好明天交换。孩子进入生活后，你们先让彼此知道今晚谁在接哪一部分。"],"kind":"home","item":"生活里第一次多出的呼吸","timing":{"min":42,"max":108},"family":true,"requires":{"prepared":true,"child":false},"afterFlag":"preparedAt","afterMonths":12,"familyEffect":"arrival"},{"id":235,"title":"凌晨三点的那句重话","body":"连续几晚没睡好，孩子又醒了。对方起身慢了一点，你脱口而出一句重话，随后两个人都沉默了。天还没亮，你们都累得不像平时的自己。","choices":["承认刚才说重了，也说出自己的疲惫","先把这一班分清，天亮后认真谈","先请对方接手片刻，等平静后再解释"],"memories":["凌晨三点，我承认自己说重了，也把疲惫讲出来。难熬的夜里，我们还需要看见身旁那个同样没睡好的人。","我先把这一班重新分清，约好天亮再谈。疲惫不能立刻消失，但不该让一句重话成为这晚的结尾。","我请你先接手片刻，等平静后再解释自己的疲惫，不让失控的语气替真实的需要说话。"],"replies":["对方也承认最近漏接了几次照料，把下一班接过来。道歉没有让夜晚变短，却让分担重新开始。","对方答应先接手，也请你不要把白天的谈话省掉。你们把要改的事留到了清醒时继续。","对方先接手，让你缓一缓，也说希望清醒后把这几晚的难处讲清。暂时离开争执，仍然会回来一起处理。"],"kind":"repair","item":"凌晨三点的那句重话","timing":{"min":48,"max":120},"family":true,"requires":{"child":true},"afterFlag":"childAt","afterMonths":3,"childMax":24},{"id":236,"title":"那张表终于改了一格","body":"后来回看那几晚，你们发现最累的部分并没有平均分开。对方拿来照护表，先划掉自己做不到的一班，提出换成一段真正能承担的时间。","choices":["重新分班，把连续休息留给彼此","一起找能轮换的支持，不再硬撑","先试行一周，再按实际疲惫程度调整"],"memories":["我和你重新分班，让每个人都有一段不被叫醒的休息。一起扛过困难，有时就是把表上的一格真的改掉。","我和你一起找能轮换的支持，不再把硬撑当成负责。这个家需要我们，也需要我们有力气。","我和你先试行一周，再按真实的疲惫调整，让分工可以随着生活改变。"],"replies":["对方按照新的一班提前结束手头的事。你们约好过一阵再看，而不是改完表就当问题解决了。","对方负责询问可靠的临时支持，你负责核对时间和费用。事情仍然不少，至少不再只压在两个人的疲惫上。","对方愿意先试一周，把每次接班和休息的情况记下来。你们约好到时再看，不用一张表要求自己永远撑得住。"],"kind":"home","item":"那张表终于改了一格","timing":{"min":54,"max":120,"prior":235,"gap":3},"family":true,"familyFollow":true},{"id":237,"title":"谁记得那些还没做的事","body":"孩子的日用品、下次预约、要替换的衣服，都在你的备忘录里。对方问有什么需要帮忙，你忽然有点委屈：你不想永远先想好一切，再把任务分出去。","choices":["把整件事交接，连准备与记忆一起分担","一起列出看不见的劳动，重新认领","先完整交接一类事务，减少反复提醒"],"memories":["我说出自己不想永远做那个提醒的人。我们开始分担整件事，而不是只分担被交代的最后一步。","我和你把那些看不见的劳动列出来。原来让日子顺利运转，也需要有人一直记着，而这不该只有我。","我先完整交接一类日常事务，把准备、执行和收尾都交清，让分担不再停在最后一步。"],"replies":["对方主动认领一整类日常事务，连时间和准备也自己记。你们约好确认结果，而不是等你继续催。","对方看完清单，承认自己漏看了许多。你们各自认领，也把不知道怎么做的部分一起学。","对方接下这一整类事务，主动确认准备和收尾的细节。以后怎样安排，不再等你每一次提醒。"],"kind":"repair","item":"谁记得那些还没做的事","timing":{"min":60,"max":120},"family":true,"requires":{"child":true},"afterFlag":"childAt","afterMonths":6},{"id":238,"title":"同一句话，三代人的意思","body":"长辈照看孩子后，你们对一个日常习惯有不同看法。对方感激家人的帮助，却也担心你一直忍着。孩子睡下后，你们终于坐到同一边商量。","choices":["先统一两人的想法，再一起向长辈说明","感谢帮助，也调整照护安排减少冲突","先了解长辈的顾虑，再清楚说明共同决定"],"memories":["我先和你把想法说到一起，再去面对长辈。感谢照顾和守住养育的边界，都是我们要一起做的事。","我感谢家人的帮助，也和你调整照护安排。不能把所有人的好意，都变成某一个人必须忍耐的理由。","我和你先听完长辈的顾虑，也清楚说明共同决定，让尊重与边界同时留在谈话里。"],"replies":["对方亲自向自己的家人说明约定，你也负责说清自己这边。你们没有让孩子传话，也没有让一方独自做坏人。","对方和你重新核对可承担的时间，减少需要长辈代劳的部分。安排更费心，却给关系留出了呼吸。","对方先听家人说完顾虑，再和你一起把共同的安排讲清。帮助值得感谢，养育的决定也需要两个人一起守住。"],"kind":"repair","item":"同一句话，三代人的意思","timing":{"min":60,"max":120},"family":true,"requires":{"child":true,"contact":true},"afterFlag":"childAt","afterMonths":12},{"id":239,"title":"校门口的两张工作日历","body":"孩子到了入学的年纪。接送时间和两个人的工作撞在一起，对方把自己的日历也拿出来：不能默认总是你的安排可以改。","choices":["轮流协调工作，先落实这一学期","一起找接送支持，也保留各自重要的工作","先试行一个月，再看哪种安排能持续"],"memories":["校门口的时间表前，我和你轮流调整工作。成为父母之后，我们也仍是有各自人生的两个人。","我和你一起寻找接送支持，把各自重要的工作也认真放进安排里。照顾这个家，不该只剩一种牺牲的方式。","我和你先试行一个月，再看怎样接送能够持续，不把一张新表当作已经解决了生活。"],"replies":["对方先协调自己能调整的时段，把落实后的时间告诉你。你们再一起补剩下的空缺。","对方负责核对支持人选和时间，你负责另一部分安排。清单还没有全空下来，但责任开始有了两个名字。","对方先落实试行这一个月能负责的时段，也和你约好一起检查哪里撑不住。你们给安排留了修改的余地。"],"kind":"repair","item":"校门口的两张工作日历","timing":{"min":108,"max":120},"family":true,"requires":{"child":true},"afterFlag":"childAt","afterMonths":72},{"i
