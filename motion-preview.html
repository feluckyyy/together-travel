#travel-motion-studies .motion-main{color:#fff3df;text-align:center;font-size:14px;}
#travel-motion-studies .motion-home-indicator{position:absolute;bottom:8px;left:40%;width:20%;height:3px;border-radius:3px;background:#a5b0a0;opacity:.55;pointer-events:none;}
#travel-motion-studies .motion-controls{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:12px;min-height:48px;margin-top:12px;}
#travel-motion-studies .motion-status{max-width:240px;}
#travel-motion-studies .motion-journal{background:#ffffff11;color:#fff3df;border:1px solid #ffffff50;box-shadow:0 15px 50px #0002;-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);position:relative;transform-origin:9% 50%;border-radius:15px;padding:22px 19px;margin:5px 0;}
#travel-motion-studies .motion-journal::before{display:none;}
#travel-motion-studies .motion-journal .motion-time{color:#e4d5ba;margin-bottom:15px;}
#travel-motion-studies .motion-journal h3{margin-bottom:10px;}
#travel-motion-studies .motion-journal p{font-size:14px;line-height:2.1;}
#travel-motion-studies .motion-small{font-size:11px;opacity:.65;}
#travel-motion-studies .motion-diary{margin-top:auto;border-top:1px solid #dce1cf45;padding-top:12px;}
#travel-motion-studies .motion-diary-title{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:12px;color:#ced7bf;margin-bottom:10px;}
#travel-motion-studies .motion-diary-entry{padding:7px 0 6px 11px;border-left:1px solid #c9d2bc66;}
#travel-motion-studies .motion-diary-entry time{font-size:11px;color:#c6d4b8;}
#travel-motion-studies .motion-diary-entry p{font-size:12px;line-height:1.9;}
#travel-motion-studies .motion-flying{position:absolute;padding:12px 13px;background:#ffffff11;color:#fff3df;border:1px solid #ffffff50;border-radius:15px;-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-sizing:border-box;font-size:13px;line-height:1.5;z-index:5;pointer-events:none;transform-origin:left top;}
#travel-motion-studies .motion-journal,#travel-motion-studies .motion-action{position:relative;z-index:0;}
#travel-motion-studies .motion-journal,#travel-motion-studies .motion-action,#travel-motion-studies .motion-flying{background:transparent;border-color:var(--motion-glass-edge);-webkit-backdrop-filter:none;backdrop-filter:none;}
#travel-motion-studies .motion-journal::before,#travel-motion-studies .motion-action::before,#travel-motion-studies .motion-flying::before{display:block;content:&quot;&quot;;position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:var(--motion-glass-fill);-webkit-backdrop-filter:var(--motion-glass-blur);backdrop-filter:var(--motion-glass-blur);opacity:var(--motion-glass-strength);}
#travel-motion-studies .motion-retiring .motion-journal,#travel-motion-studies .motion-retiring .motion-action{border-color:transparent;box-shadow:none;}
#travel-motion-studies .motion-retiring .motion-journal::before,#travel-motion-studies .motion-retiring .motion-action::before{display:none;}
#travel-motion-studies .motion-awaiting-memory{visibility:hidden;}
#travel-motion-studies .motion-action[aria-pressed=&quot;true&quot;]{border-color:#e4d5ba;}
#travel-motion-studies .motion-year{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;background:#19271edb;pointer-events:none;z-index:5;color:#f5efdf;}
#travel-motion-studies .motion-year strong{font:400 36px/1.5 &quot;Songti SC&quot;,serif;}
#travel-motion-studies .motion-year span{font:italic 14px/1.6 Georgia,serif;color:#d3d5c2;}
#travel-motion-studies .motion-finale{padding:20px 18px 24px;gap:13px;background:radial-gradient(ellipse at 100% 0%,#f0d7cd,transparent 72%),radial-gradient(ellipse at 0% 100%,#e9eddf,transparent 55%),#f7f4ed;color:#5b5249;}
#travel-motion-studies .motion-letterhead{display:flex;justify-content:space-between;gap:10px;font-size:10px;color:#927769;padding-bottom:10px;border-bottom:1px solid #c8b6a74d;}
#travel-motion-studies .motion-final-hero{display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:18px;min-height:270px;}
#travel-motion-studies .motion-photo{background:#fffefa;padding:7px 7px 9px;box-shadow:0 8px 16px #4e3a2420;transform:rotate(-1.3deg);position:relative;}
#travel-motion-studies .motion-photo img{display:block;width:100%;height:208px;object-fit:contain;}
#travel-motion-studies .motion-photo figcaption{font-size:8px;line-height:1.5;color:#927769;margin-top:7px;}
#travel-motion-studies .motion-destination{display:flex;flex-direction:column;align-items:flex-start;gap:10px;}
#travel-motion-studies .motion-destination h2{font-size:35px;line-height:1.2;color:#976960;}
#travel-motion-studies .motion-destination .motion-dest-line{font:400 17px/1.6 &quot;Songti SC&quot;,serif;}
#travel-motion-studies .motion-destination .motion-poem{font:400 11px/1.9 &quot;Songti SC&quot;,serif;}
#travel-motion-studies .motion-destination i{font:italic 15px/1.3 Georgia,serif;color:#9c7e70;}
#travel-motion-studies .motion-short-route{border-top:1px solid #c9b8a66b;padding-top:10px;}
#travel-motion-studies .motion-short-route h3{font:400 13px/1.6 &quot;Songti SC&quot;,serif;margin-bottom:5px;color:#957a69;}
#travel-motion-studies .motion-short-route p{font-size:11px;line-height:1.9;}
#travel-motion-studies .motion-final-foot{margin-top:auto;padding-top:9px;border-top:1px solid #c9b8a64d;font:400 11px/1.5 &quot;Songti SC&quot;,serif;color:#8a7a69;}
#travel-motion-studies .motion-photo-cover{position:absolute;inset:7px 7px 28px;background:#eee9da;pointer-events:none;}
#travel-motion-studies .motion-arrival{justify-content:center;align-items:center;text-align:center;gap:22px;}
#travel-motion-studies .motion-arrival h2{font-size:30px;}
#travel-motion-studies .motion-arrival .motion-action{margin-top:18px;}
#travel-motion-studies .motion-seal{display:inline-block;color:#576b50;font:400 12px/1.5 &quot;Songti SC&quot;,serif;opacity:0;pointer-events:none;}
@media(max-width:380px){#travel-motion-studies .motion-demo{padding-left:5px;padding-right:5px;}#travel-motion-studies .motion-pane{padding-left:17px;padding-right:17px;}#travel-motion-studies .motion-final-hero{gap:12px;}#travel-motion-studies .motion-destination h2{font-size:30px;}#travel-motion-studies .motion-phone{border-width:5px;}#travel-motion-studies .motion-photo img{height:190px;}}
@media(prefers-reduced-motion:reduce){#travel-motion-studies .motion-action{transition:none;}#travel-motion-studies .motion-action:active{transform:none;}}
